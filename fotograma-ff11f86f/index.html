<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FOTOGRAMA</title>
<style>
  :root{--bg:#100F0D;--panel:#171613;--line:#2E2B25;--text:#EDEAE0;--dim:#8F8B7E;--accent:#E8563D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
  .box{width:min(340px,90vw);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:34px 30px;text-align:center}
  .mark{font:800 26px/1 "Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",sans-serif;
    letter-spacing:-.03em;text-transform:uppercase;margin-bottom:6px}
  .label{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:26px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:11px 12px;font:inherit;text-align:center;letter-spacing:.06em}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:12px;background:var(--accent);border:none;border-radius:8px;
    color:#160905;font:700 13px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
    padding:12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .err{min-height:18px;font-size:12px;color:var(--accent);margin-top:12px}
</style>
</head>
<body>
<div class="box">
  <div class="mark">Fotograma</div>
  <div class="label">Renta de equipo · México</div>
  <input id="p" type="password" placeholder="CONTRASEÑA" autofocus autocomplete="off">
  <button id="go">Entrar</button>
  <div class="err" id="err"></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(){
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pass = document.getElementById("p").value;
  if (!pass) return;
  btn.disabled = true; err.textContent = "";
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    btn.disabled = false;
    err.textContent = "Contraseña incorrecta";
  }
}
document.getElementById("go").addEventListener("click", open_);
document.getElementById("p").addEventListener("keydown", e => { if (e.key === "Enter") open_(); });
