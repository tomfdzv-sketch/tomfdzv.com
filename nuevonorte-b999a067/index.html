.cv-print td.yr { width: 54px; font-family: var(--pp-mono); font-size: 10.5px;
  font-variant-numeric: tabular-nums; color: var(--pp-dim); vertical-align: top; }
.cv-print td.rl { text-align: right; color: var(--pp-dim); white-space: nowrap; font-size: 10.5px; vertical-align: top; }
.cv-print td.sub { font: 600 7.5px/1.4 var(--pp-mono); text-transform: uppercase; letter-spacing: .18em;
  color: var(--pp-ink2); border-bottom: 1px solid var(--pp-ink); padding-top: 14px; }
.cv-print .nt { font-size: 10.5px; color: var(--pp-dim); font-style: italic; margin-top: 2px; }

/* ============================================================
   WYSIWYG screenplay editor (element-typed, industry format)
   ============================================================ */
.sw { position: relative; }
.sw-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sw-title { font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: 18px; }
.sw-status { font: 700 11px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; color: var(--ai); }
.sw-status.dirty { color: var(--yellow); }
.sw-pages { font: 700 11px/1 var(--cond); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.sw-bar .spacer { flex: 1; }
#sw-el { background: var(--input-bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 6px 10px; font-family: var(--cond); text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
.sw-wrap { display: flex; gap: 18px; align-items: flex-start; }
.sw-nav { width: 200px; flex: none; position: sticky; top: 8px; max-height: 78vh; overflow-y: auto;
  border-right: 1px solid var(--line); padding-right: 8px; }
.sw-nav-i { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  color: var(--dim); font: 700 11px/1.3 var(--cond); text-transform: uppercase; letter-spacing: .03em;
  padding: 6px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-nav-i:hover { color: var(--text); background: var(--panel2); }
.sw-nav-empty { font-size: 11px; color: var(--dim); padding: 6px; }
@media (max-width: 900px) { .sw-nav { display: none; } }

/* the paper page */
.sw-page { flex: 1; min-width: 0; background: #fbf9f4; color: #16130d; border-radius: 4px;
  box-shadow: var(--shadow); padding: 52px clamp(28px, 6%, 84px); max-width: 74ch; min-height: 64vh;
  font: 15px/1.62 "Courier New", Courier, monospace; }
.spb { outline: 0; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.62em; caret-color: var(--accent); }
.spb:focus { background: rgba(109,150,166,.10); border-radius: 2px; }
.spb-scene { text-transform: uppercase; font-weight: 700; margin: 1.5em 0 .35em; }
.spb-scene:first-child { margin-top: 0; }
.spb-action { margin: 0 0 .55em; }
.spb-character { text-transform: uppercase; margin: 1em 0 0 22ch; }
.spb-parenthetical { margin: 0 0 0 16ch; max-width: 26ch; color: #333; }
.spb-dialogue { margin: 0 0 0 10ch; max-width: 36ch; }
.spb-transition { text-transform: uppercase; text-align: right; margin: 1em 0 1.2em; }
.spb-section { text-transform: uppercase; font-weight: 700; letter-spacing: .06em; color: #9a4b36;
  margin: 1.8em 0 .4em; padding-bottom: 3px; border-bottom: 1px solid #e0d8c6; font-size: 13px; }
.sw-hint { margin-top: 12px; }
.sw-hint code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }

/* autocomplete */
.sw-ac { position: absolute; z-index: 60; min-width: 190px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--lift); overflow: hidden; }
.sw-ac.hidden { display: none; }
.sw-ac-i { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  color: var(--text); padding: 7px 12px; font: 13px "Courier New", monospace; text-transform: uppercase; }
.sw-ac-i:hover, .sw-ac-i.on { background: var(--accent); color: #fff; }

/* personal-calendar event detail popup (in-app, instead of opening Google) */
.evpop { position: fixed; inset: 0; z-index: 2100; display: grid; place-items: center; padding: 5vh 5vw; }
.evpop.hidden { display: none; }
.evpop-scrim { position: absolute; inset: 0; background: rgba(10,8,6,.55); backdrop-filter: blur(2px); }
.evpop-card { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--lift); width: 440px; max-width: 92vw; padding: 26px 26px 20px;
  max-height: 86vh; overflow-y: auto; }
/* grants popup: label/value detail rows */
.evpop-dl-list { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
.evpop-dt { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
.evpop-dl { flex: none; width: 100px; color: var(--dim); font-family: var(--cond); text-transform: uppercase;
  letter-spacing: .05em; font-size: 11px; }
.evpop-dv { color: var(--text); flex: 1; line-height: 1.5; }
.evpop-bar { height: 4px; width: 46px; border-radius: 2px; background: var(--accent); margin-bottom: 14px; }
.evpop-x { position: absolute; top: 12px; right: 14px; border: 0; background: none; color: var(--dim);
  font-size: 24px; line-height: 1; cursor: pointer; }
.evpop-x:hover { color: var(--text); }
.evpop-title { font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em;
  font-size: 24px; margin: 0 24px 8px 0; line-height: 1.05; -webkit-text-stroke: .4px currentColor; }
.evpop-when { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  font-size: 13px; color: var(--accent); }
.evpop-where { font-size: 13px; color: var(--dim); margin-top: 8px; }
.evpop-notes { font-size: 13.5px; line-height: 1.6; color: var(--text); margin-top: 14px;
  white-space: pre-wrap; max-height: 42vh; overflow-y: auto; }
.evpop-actions { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.evpop-gcal { color: var(--accent); text-decoration: none; font-size: 13px; }
.evpop-gcal:hover { color: var(--yellow); }
.evpop-del { background: none; border: 1px solid var(--line); color: var(--red); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; font-size: 12px; }
.evpop-del:hover { border-color: var(--red); background: color-mix(in oklab, var(--red) 12%, transparent); }

/* ============================================================
   Calendar controls: cycle through the tricolor palette forever
   (Year/Month/Week active segment + festival/lab/grant/fund chips)
   ============================================================ */
@keyframes triBg { 0%, 100% { background-color: var(--tri-blue); } 25% { background-color: var(--yellow); } 50% { background-color: var(--ai); } 75% { background-color: var(--pink); } }

/* active Year/Month/Week button (both calendars) — dark text stays readable across the cycle */
.gr-seg button.active { background: var(--tri-blue); color: #16130d; animation: triBg 7s ease-in-out infinite; }

/* festival / labs / grants / funds filters: stay white, turn a random tricolor on hover */
.gr-chip { transition: color .15s ease, border-color .15s ease; }
.gr-chip:hover { color: var(--hovc, var(--accent)); border-color: var(--hovc, var(--accent)); }

@media (prefers-reduced-motion: reduce) { .gr-seg button.active { animation: none; } }

/* ============================================================
   App-wide: action buttons pulse through the tricolor palette
   (like the Year/Month/Week button). Filled buttons cycle their
   fill; outline/mini/toolbar buttons cycle text + border.
   Excludes: filter chips + selection toggles (hover instead),
   delete/danger buttons (stay red), and icon toggles.
   ============================================================ */
@keyframes triFill { 0%, 100% { background-color: var(--tri-blue); border-color: var(--tri-blue); }
  25% { background-color: var(--yellow); border-color: var(--yellow); }
  50% { background-color: var(--ai); border-color: var(--ai); }
  75% { background-color: var(--pink); border-color: var(--pink); } }
@keyframes triLine { 0%, 100% { color: var(--tri-blue); border-color: var(--tri-blue); }
  25% { color: var(--yellow); border-color: var(--yellow); }
  50% { color: var(--ai); border-color: var(--ai); }
  75% { color: var(--pink); border-color: var(--pink); } }

button.primary, .btn.primary { color: #16130d; animation: triFill 7s ease-in-out infinite; }
.mini:not(.danger):not(.primary),
.ghost:not(.danger):not(.primary):not(.gr-chip),
.post-actions button:not(.primary):not(.danger):not(.gr-chip) { animation: triLine 7s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  button.primary, .btn.primary, .mini:not(.danger):not(.primary),
  .ghost:not(.danger):not(.primary):not(.gr-chip),
  .post-actions button:not(.primary):not(.danger):not(.gr-chip) { animation: none; }
}

/* menu footer: clickable user chip → profile panel */
.mf-user { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer;
  padding: 6px 4px; color: var(--tomo-dim, var(--dim)); transition: color .15s ease; }
.mf-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none;
  animation: triFill 7s ease-in-out infinite; }
.mf-who { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.mf-user:hover .mf-who { color: var(--hovc, var(--tomo-ink, var(--text))); }

/* profile panel (reuses .evpop shell) */
.prof-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.prof-av-lg { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: #16130d; font: 800 20px/1 var(--cond); text-transform: uppercase; flex: none; }
.prof-name-big { font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: 22px;
  animation: triLine 7s ease-in-out infinite; }
.prof-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
.prof-body .field { margin-bottom: 14px; }
.prof-row { display: flex; gap: 8px; align-items: center; }
.prof-row input { flex: 1; }
.prof-svc { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.prof-svc-i { display: flex; align-items: center; gap: 10px; }
.prof-svc-n { font-family: var(--cond); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--dim); width: 78px; flex: none; }
.prof-ok { color: var(--ai); font-size: 13px; font-weight: 600; }
.prof-actions { display: flex; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }

/* profile: linked-service rows + inline credential setup */
.prof-svc-state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.prof-svc-state.prof-dim { color: var(--dim); }
.prof-svc-cfg { margin: 4px 0 6px 0; padding: 10px 12px; background: var(--panel2); border-radius: 8px; }
.prof-svc-cfg.hidden { display: none; }
.prof-svc-cfg .prof-row { margin-top: 8px; }
.prof-svc-cfg input { flex: 1; }
.prof-svc-cfg code { word-break: break-all; }

/* Spotify now-playing card in the profile */
.now-sp { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; padding: 10px 12px;
  background: var(--panel2); border-radius: 10px; }
.now-sp.hidden { display: none; }
.now-art { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; flex: none; }
.now-info { min-width: 0; }
.now-title { display: block; color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-title:hover { color: var(--ai); }
.now-artist { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-eq { display: inline-flex; gap: 2px; height: 10px; align-items: flex-end; margin-bottom: 3px; }
.now-eq span { width: 3px; background: var(--ai); border-radius: 1px; animation: eq .9s ease-in-out infinite; }
.now-eq span:nth-child(2) { animation-delay: -.3s; }
.now-eq span:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
@media (prefers-reduced-motion: reduce) { .now-eq span { animation: none; height: 7px; } }

/* persistent Spotify now-playing chip (bottom-right, always on while playing) */
#spotify-chip.sp-chip { position: fixed; right: 20px; bottom: 20px; z-index: 1400;
  display: flex; align-items: center; gap: 10px; max-width: 300px; padding: 8px 16px 8px 8px;
  background: color-mix(in oklab, var(--panel) 90%, transparent); border: 1px solid var(--line);
  border-radius: 999px; box-shadow: var(--lift); text-decoration: none; backdrop-filter: blur(10px);
  transition: transform .18s ease, border-color .18s ease; }
.sp-chip.hidden { display: none; }
.sp-chip:hover { transform: translateY(-2px); border-color: var(--ai); }
.sp-chip.paused { opacity: .85; }
/* minimized: just the album cover (click it to expand) */
.sp-chip.collapsed { padding: 5px; gap: 0; max-width: none; }
.sp-chip.collapsed .sp-chip-txt, .sp-chip.collapsed .sp-chip-ctrl { display: none; }
.sp-chip-art { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; cursor: pointer; }
.sp-chip.paused .sp-chip-art { filter: grayscale(.4); }
.sp-chip-ctrl { display: flex; align-items: center; gap: 2px; flex: none; margin-left: 2px; }
.sp-b { background: none; border: 0; cursor: pointer; color: var(--dim); font-size: 14px; line-height: 1;
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; padding: 0; transition: color .15s, background .15s; }
.sp-b:hover { color: var(--text); background: color-mix(in oklab, var(--ai) 18%, transparent); }
.sp-toggle { color: var(--ai); font-size: 15px; }
.sp-chip-txt { min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
.sp-chip-title { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-chip-artist { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.gate .sp-chip { display: none !important; }

/* coverless project cards: the same live tricolor wash as the project hero (staggered per card) */
.pcard-img.placeholder.pcard-tri { background: linear-gradient(125deg, var(--tri-blue), var(--yellow), var(--ai), var(--pink), var(--tri-blue), var(--yellow));
  background-size: 320% 320%; animation: triFlow 22s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pcard-img.placeholder.pcard-tri { animation: none; } }

/* screenwriter: scene numbers (toggle — class lives on #sw-doc) + report panel */
#sw-doc.numbered { counter-reset: sc; }
#sw-doc.numbered .spb-scene { counter-increment: sc; }
#sw-doc.numbered .spb-scene::before { content: counter(sc); position: absolute; left: -2.4em; color: #9a948a; font-weight: 400; font-size: .82em; }
#sw-doc.numbered .spb-scene::after { content: counter(sc); position: absolute; right: -2.4em; color: #9a948a; font-weight: 400; font-size: .82em; }
#sw-doc.numbered .spb-scene { position: relative; }

/* scene summary blocks (Fountain "=" synopsis — on screen, never printed) */
.spb-synopsis { margin: 0 0 .55em; padding: 2px 8px; font-style: italic; font-size: .92em;
  color: #6d6355; background: rgba(109,150,166,.08); border-left: 3px solid rgba(109,150,166,.5); border-radius: 2px; }
.spb-synopsis:empty::before, .spb-synopsis:has(> br:only-child)::before { content: ""; }

/* dual dialogue badge on a character cue (⌘D) */
.spb-character[data-dual]::after { content: "⇄ DUAL"; margin-left: 1ch; font-size: .68em;
  letter-spacing: .08em; color: #9a4b36; vertical-align: 2px; }

/* night mode — dark paper for late writing */
.sw-page.night { background: #1d1b17; color: #e8e3d8; }
.sw-page.night .spb-parenthetical { color: #b8b2a4; }
.sw-page.night .spb-synopsis { color: #a89f8d; background: rgba(109,150,166,.12); }
.sw-page.night .spb:focus { background: rgba(109,150,166,.18); }

/* scene navigator: reorder + summaries */
.sw-nav-it { border-radius: 8px; margin-bottom: 2px; }
.sw-nav-it.dragging { opacity: .45; }
.sw-nav-it { cursor: grab; }
.sw-nav-n { display: inline-block; min-width: 1.6em; color: var(--dim); font-weight: 400; }
.sw-nav-sum { font-size: 10.5px; color: var(--dim); font-style: italic; padding: 0 6px 5px 8px;
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-nav-sum:hover { color: var(--text); }

/* breakdown panel */
.sw-bd { width: 230px; flex: none; position: sticky; top: 8px; max-height: 78vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.sw-bd.hidden { display: none; }
.sw-bd-head { font: 800 12px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.sw-bd-scene { font: 700 11px/1.3 var(--cond); text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.sw-bd-hint { font-size: 11px; color: var(--dim); margin: 4px 0; }
.sw-bd-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.sw-bd-cat { border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  border-radius: 999px; padding: 3px 9px; font-size: 10.5px; cursor: pointer; }
.sw-bd-cat:hover { border-color: var(--accent); }
.sw-bd-group { margin-bottom: 8px; }
.sw-bd-gl { display: block; font: 700 9.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin-bottom: 3px; }
.sw-bd-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
  padding: 2px 4px 2px 9px; font-size: 11px; margin: 0 4px 4px 0; background: var(--panel2); border: 1px solid var(--line); }
.sw-bd-chip button { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 0 3px; }
.sw-bd-chip button:hover { color: var(--danger, #c0392b); }
.bd-cast { border-color: #6d96a6; } .bd-extra { border-color: #8aa66d; }
.bd-prop { border-color: #c2a24b; } .bd-wardrobe { border-color: #b06da6; }
.bd-art { border-color: #a6786d; } .bd-vehicle { border-color: #7d6da6; }
.bd-sound { border-color: #5fae9b; } .bd-vfx { border-color: #a65f5f; }
.bd-other { border-color: var(--line); }
.sw-bd-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.sw-bd-actions .mini { width: 100%; }
#sw-bd-btn.active { background: var(--accent); color: #fff; }
@media (max-width: 1100px) { .sw-bd { width: 190px; } }
@media (max-width: 900px) { .sw-bd { display: none; } }
.bd-sheet-scene { margin-bottom: 18px; page-break-inside: avoid; }
.bd-sheet-sum { font-style: italic; color: #555; margin: 2px 0 6px; }

/* shot list drawer */
.sh-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sh-no { font: 800 13px/1 var(--cond); color: var(--accent); min-width: 2.6em; padding-top: 4px; }
.sh-img { width: 74px; height: 50px; flex: none; border: 1px dashed var(--line); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--dim);
  font-size: 18px; overflow: hidden; background: var(--panel2); }
.sh-img img { width: 100%; height: 100%; object-fit: cover; }
.sh-fields { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sh-fields label { font: 600 10px/1.4 var(--cond); text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); display: flex; flex-direction: column; gap: 2px; }
.sh-fields select, .sh-fields input, .sh-fields textarea { font-size: 12px; }
.sh-fields .sh-notes { grid-column: 1 / -1; }

/* version history drawer */
.vh-row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--line); }
.vh-meta { display: flex; flex-direction: column; gap: 2px; }
.vh-label { font: 700 9.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.vh-paper { background: #fbf9f4; color: #16130d; border-radius: 6px; padding: 18px 22px;
  margin-top: 8px; max-height: 46vh; overflow-y: auto; font: 12.5px/1.5 "Courier New", Courier, monospace; }

/* insights bars */
.sw-brow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.sw-blab { width: 110px; flex: none; font: 600 10.5px/1.2 var(--cond); text-transform: uppercase;
  letter-spacing: .05em; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-bbg { flex: 1; height: 8px; border-radius: 999px; background: var(--panel2); overflow: hidden; }
.sw-bbg.big { height: 14px; margin: 6px 0 4px; }
.sw-bfill { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.sw-bval { flex: none; min-width: 60px; text-align: right; font-size: 11px; color: var(--dim); }
.sw-goal { margin-bottom: 6px; }
.sw-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 14px; }
.sw-stat { background: var(--panel2); border-radius: 10px; padding: 12px; text-align: center; }
.sw-stat b { display: block; font-family: var(--cond); font-weight: 800; font-size: 26px; line-height: 1; color: var(--text); }
.sw-stat span { font: 600 10px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

/* ============================================================
   Media & 3-2-1 — health summary + at-risk-first, cleaner cards
   ============================================================ */
#media-body { max-width: 1180px; }
.mp-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.mp-stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.mp-stat b { display: block; font-family: var(--cond); font-weight: 800; font-size: clamp(22px, 3vw, 32px); line-height: 1; color: var(--text); letter-spacing: -.01em; }
.mp-stat span { font: 600 10px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 8px; display: block; }
.mp-stat.mp-danger { border-color: var(--red); }
.mp-stat.mp-danger b { color: var(--red); }
.mp-stat.mp-safe b { color: var(--ai); }
@media (max-width: 720px) { .mp-summary { grid-template-columns: repeat(2, 1fr); } }

.mp-controls { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.mp-controls input[type=search] { flex: 1 1 240px; min-width: 180px; padding: 9px 14px; background: var(--input-bg); border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
.mp-count { font: 600 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-left: auto; }

.mp-group-h { font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  font-size: 15px; color: var(--dim); margin: 8px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.mp-group-h.danger { color: var(--red); }
.mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 26px; }

.mp-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.mp-card:hover { transform: translateY(-3px); box-shadow: var(--lift); }
.mp-card.risk { border-left: 3px solid var(--red); }
.mp-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.mp-name { font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: 18px;
  color: var(--text); line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .15s ease; }
.mp-name:hover { color: var(--hovc, var(--accent)); }
.mp-copies { flex: none; font: 700 12px/1 var(--cond); letter-spacing: .04em; padding: 5px 9px; border-radius: 999px; }
.mp-copies.ok { color: var(--ai); background: color-mix(in oklab, var(--ai) 14%, transparent); }
.mp-copies.bad { color: var(--red); background: color-mix(in oklab, var(--red) 14%, transparent); }
.mp-meta { font-size: 12px; color: var(--dim); margin-top: 8px; }
.mp-state { text-transform: capitalize; font-weight: 600; }
.mp-locs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mp-loc { font-size: 11px; color: var(--dim); background: var(--panel2); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }

/* ===== Script editor v2 (Fable consolidation) — page breaks, find bar,
   phone toolbar, paginated print. Fold into the design system on next pass. */
#sw-doc { outline: none; min-height: 320px; }
#sw-doc .spb { position: relative; }
/* real page separation: a bg-colored band "cuts" the paper into sheets */
.sw-page { overflow: hidden; }   /* clip the band at the paper's edges */
.spb-pagetop { border-top: 0; margin-top: 0 !important; padding-top: 108px; position: relative; }
.spb-pagetop::before { content: ""; position: absolute; left: -999px; right: -999px;
  top: 26px; height: 44px; background: var(--bg);
  box-shadow: inset 0 8px 8px -8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(0,0,0,.25); }
.spb-pagetop::after { content: "p. " attr(data-page); position: absolute; right: 0; top: 42px;
  font: 600 10px/1 var(--cond, sans-serif); letter-spacing: .06em; color: var(--dim, #9a948a); }
.sw-page.night .spb-pagetop::before { box-shadow: inset 0 8px 8px -8px rgba(0,0,0,.85), inset 0 -1px 0 rgba(0,0,0,.5); }
.sw-findbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px;
  border: 1px solid rgba(127,127,127,.25); border-radius: 8px; margin: 6px 0; flex-wrap: wrap; }
.sw-findbar input { width: 150px; }
.sw-mbar { display: none; }
@media (max-width: 700px) {
  .sw-mbar { display: flex; gap: 4px; position: sticky; bottom: 0; z-index: 30;
    padding: 6px 4px; overflow-x: auto; background: var(--bg, #16130d);
    border-top: 1px solid rgba(127,127,127,.3); }
  .sw-mbar button { flex: 0 0 auto; padding: 8px 10px; font-size: 12px; }
  .sw-nav { display: none; }
}
/* paginated print: one .sp-printpage per sheet. Screenplay stays pure
   industry Courier; only the ink joins the print system (warm near-black). */
.sp-print { color: #16130F; }
.sp-print .sp-printpage { page-break-after: always; position: relative;
  font-family: "Courier New", Courier, monospace; font-size: 12pt; line-height: 1; }
.sp-print .sp-pghead { text-align: right; font-size: 10pt; color: #16130F; min-height: 14pt;
  font-variant-numeric: tabular-nums; }
.sp-print .sp-scene[data-no]::before { content: attr(data-no) " "; }
.sp-print .sp-tp { display: flex; flex-direction: column; min-height: 88vh; }
.sp-print .sp-tp-mid { margin: auto; text-align: center; }
.sp-print .sp-tp-mid .sp-title { font-weight: 700; text-decoration: underline; margin-bottom: 2em; }
.sp-print .sp-tp-mid .sp-credit { margin: .8em 0; }
.sp-print .sp-tp-foot { margin-top: auto; font-size: 10pt; }

/* ---- Plan de trabajo · conversational AI refine + version history ---- */
.rf-thread { display: flex; flex-direction: column; gap: 7px; max-height: 42vh; overflow-y: auto;
  padding: 10px; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel2); }
.rf-empty { text-align: center; padding: 14px 6px; }
.rf-msg { max-width: 88%; padding: 7px 11px; border-radius: 12px; font-size: 13px; line-height: 1.4;
  white-space: pre-wrap; word-break: break-word; }
.rf-msg.you { align-self: flex-end; background: var(--primary-bg); color: var(--primary-fg);
  border-bottom-right-radius: 4px; }
.rf-msg.ai { align-self: flex-start; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.rf-msg.ai.pending { color: var(--dim); font-style: italic; }
.rf-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.rf-chip { font-size: 11.5px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--dim); }
.rf-chip:hover { color: var(--text); border-color: var(--accent); }
.rf-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.rf-actions #rf-hist { margin-left: auto; }
.rf-vlist { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.rf-ver { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.rf-ver-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.rf-ver-main b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-ver-meta { font-size: 11px; color: var(--dim); }
.rf-restore { flex: 0 0 auto; }

/* ═══════════════════════════════════════════════════════════════════════
   Image Research  (stock.js · #research-view)
   Real footage & photo search. Marked block — fold into the design system.
   ═══════════════════════════════════════════════════════════════════════ */
#research-view .rs-bar { margin-bottom: 18px; }
.rs-search { display: flex; gap: 10px; margin-bottom: 12px; }
.rs-search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); border-radius: 10px; padding: 11px 14px; font: inherit; font-size: 15px; }
.rs-search input:focus { outline: none; border-color: var(--ink); }
.rs-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rs-spacer { flex: 1; }
.rs-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.rs-seg button { border: 0; background: var(--panel); color: var(--dim); font: inherit; font-size: 13px;
  padding: 7px 16px; cursor: pointer; }
.rs-seg button.on { background: var(--panel2); color: var(--text); }
.rs-select { border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; }
.rs-chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  background: var(--panel); color: var(--dim); font: inherit; font-size: 13px; }
.rs-chip.on, .rs-chip:hover { color: var(--text); border-color: var(--ink); background: var(--panel2); }
.rs-hint { color: var(--dim); font-size: 12.5px; margin: 10px 2px 0; }
.rs-hint code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 11.5px; }
.rs-warn { color: var(--amber); font-size: 12.5px; margin: 4px 2px 12px; }

.rs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 6px; }
.rs-tile { cursor: pointer; border-radius: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); transition: transform .12s, border-color .12s; }
.rs-tile:hover { transform: translateY(-2px); border-color: var(--ink); }
.rs-thumb { position: relative; aspect-ratio: 4 / 3; background: var(--panel2); overflow: hidden; }
.rs-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rs-noimg { width: 100%; height: 100%; background: repeating-linear-gradient(45deg, var(--panel2), var(--panel2) 8px, var(--panel) 8px, var(--panel) 16px); }
.rs-src { position: absolute; left: 7px; top: 7px; background: rgba(0,0,0,.62); color: #fff; font-size: 10.5px;
  padding: 2px 7px; border-radius: 999px; backdrop-filter: blur(3px); }
.rs-dur { position: absolute; right: 7px; bottom: 7px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px;
  padding: 2px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.rs-play { position: absolute; right: 7px; top: 7px; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-size: 11px; }
.rs-cap { padding: 8px 10px 4px; font-size: 13px; color: var(--text); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rs-sub { padding: 0 10px 9px; font-size: 11px; color: var(--dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rs-more { text-align: center; padding: 22px; }

/* preview modal */
.rs-modal { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 20px; }
.rs-modal.hidden { display: none; }
.rs-modal-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
.rs-modal-box { position: relative; z-index: 1; display: flex; gap: 0; max-width: 980px; width: 100%;
  max-height: 88vh; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; box-shadow: var(--lift); }
.rs-modal-x { position: absolute; right: 12px; top: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.5); color: #fff; cursor: pointer; font-size: 15px; }
.rs-modal-media { flex: 1 1 58%; background: #000; display: grid; place-items: center; min-width: 0; }
.rs-modal-media img, .rs-modal-media video { max-width: 100%; max-height: 88vh; display: block; object-fit: contain; }
.rs-resolving, .rs-modal-media .rs-warn { color: #ccc; padding: 40px; text-align: center; }
.rs-modal-info { flex: 1 1 42%; padding: 24px; overflow-y: auto; }
.rs-modal-info h3 { margin: 0 0 12px; font-size: 19px; line-height: 1.3; }
.rs-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.rs-meta .rs-src { position: static; }
.rs-tag { background: var(--panel2); color: var(--dim); font-size: 11px; padding: 3px 9px; border-radius: 999px; }
.rs-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 22px; font-size: 13px; }
.rs-facts dt { color: var(--dim); }
.rs-facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.rs-facts a { color: var(--ai); }
.rs-save label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.rs-save select { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 9px; padding: 9px 11px; font: inherit; margin-bottom: 10px; }
.rs-save .primary { width: 100%; }
.rs-dl-status { font-size: 12.5px; color: var(--dim); margin-top: 10px; min-height: 18px; }
.rs-dl-status.on { color: var(--text); }
.rs-ok { color: var(--green); }
.rs-need { color: var(--amber); font-size: 12px; }

/* sources panel */
.rs-sources { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; background: var(--panel); }
.rs-sources h4 { margin: 0 0 6px; font-size: 15px; }
.rs-source-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
  padding: 12px 0; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.rs-source-name { font-size: 14px; margin-right: 10px; }
.rs-source-note { color: var(--dim); font-size: 12px; margin-top: 3px; }
.rs-key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rs-key input { border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; min-width: 200px; }
.rs-key a { color: var(--ai); font-size: 12px; }
.rs-saved-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.rs-saved-head select { border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 9px; padding: 8px 11px; font: inherit; }

@media (max-width: 700px) {
  .rs-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .rs-modal { padding: 0; }
  .rs-modal-box { flex-direction: column; max-height: 100vh; height: 100%; border-radius: 0; }
  .rs-modal-media { flex: 0 0 auto; max-height: 46vh; }
  .rs-modal-media img, .rs-modal-media video { max-height: 46vh; }
  .rs-modal-info { flex: 1 1 auto; }
  .rs-search input { font-size: 16px; }
}

/* image research — paid/free filter additions (stock.js) */
.rs-paid { position: absolute; right: 7px; bottom: 7px; background: var(--gold); color: #160905;
  font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
.rs-tile .rs-thumb .rs-dur + .rs-paid, .rs-tile .rs-thumb .rs-paid:not(:first-of-type) { bottom: 30px; }
.rs-paidtag { background: var(--gold-soft, rgba(231,184,75,.15)); color: var(--gold); font-size: 11px;
  padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
.rs-paid-banner { background: var(--gold-soft, rgba(231,184,75,.14)); border: 1px solid var(--gold);
  color: var(--text); font-size: 12.5px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; }
.rs-paid-banner a { display: inline-block; margin-top: 6px; color: var(--gold); font-weight: 600; }

/* ---- Plan de trabajo · library (grouped cards) + focused bar ---- */
.pl-group { margin-top: 20px; }
.pl-group:first-of-type { margin-top: 14px; }
.pl-group-h { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.pl-group-n { font-size: 11px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px; color: var(--dim); }
.pl-cards { display: flex; flex-direction: column; gap: 8px; }
.pl-card { display: flex; align-items: center; gap: 10px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--panel);
  transition: border-color .12s ease, transform .05s ease; }
.pl-card:hover { border-color: var(--accent); }
.pl-card:active { transform: scale(.995); }
.pl-card-main { flex: 1; min-width: 0; cursor: pointer; }
.pl-card-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-card-meta { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.pl-card-acts { display: flex; gap: 4px; flex: 0 0 auto; }
.pl-card-acts button { background: none; border: 1px solid transparent; border-radius: 8px;
  padding: 4px 8px; cursor: pointer; color: var(--dim); font-size: 13px; line-height: 1; }
.pl-card-acts button:hover { border-color: var(--line); color: var(--text); }
.pl-card-acts .pl-del:hover { color: var(--amber); border-color: var(--amber); }

.pl-bar { display: flex; align-items: center; gap: 12px; padding: 6px 2px 12px; margin-bottom: 14px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pl-back { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
  cursor: pointer; color: var(--dim); font-size: 13px; flex: 0 0 auto; }
.pl-back:hover { color: var(--text); border-color: var(--accent); }
.pl-bar-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
.pl-bar-title b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-bar-kind { color: var(--accent); flex: 0 0 auto; }
.pl-bar-meta { font-size: 11.5px; color: var(--dim); flex: 0 0 auto; }
.pl-switch { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 8px; color: var(--text); font-size: 12.5px; max-width: 44vw; }

/* ---- Media & 3-2-1 · summary strip + grouped copy-status cards ---- */
.md-summary { display: flex; gap: 18px; align-items: baseline; flex: 1; font-size: 12.5px; color: var(--dim); flex-wrap: wrap; }
.md-summary b { color: var(--text); font-size: 15px; }
.md-summary .md-danger b { color: var(--amber); }
.md-group { margin-top: 18px; }
.md-group-h { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.md-group-h.danger { color: var(--amber); }
.md-group-n { font-size: 11px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px; color: var(--dim); }
.md-cards { display: flex; flex-direction: column; gap: 8px; }
.md-card { display: flex; align-items: center; gap: 10px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
.md-card.risk { border-left: 3px solid var(--amber); }
.md-card-main { flex: 1; min-width: 0; }
.md-card-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-card-meta { font-size: 11.5px; color: var(--dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-badge { flex: 0 0 auto; font-size: 11px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.md-badge.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
.md-badge.bad { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 55%, transparent); }

/* ---- fold: collapsed action/version rows (see app.js afFold) ---- */
.af-toggle { font-size: 12px; padding: 5px 12px; border-radius: 999px;
  background: var(--fill); border: 1px solid var(--line); color: var(--dim, var(--muted));
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.af-toggle:hover { border-color: var(--accent); color: var(--text); }
.af.af-open .af-toggle { border-color: var(--accent); color: var(--text); }
.af-caret { font-size: 10px; opacity: .7; }
/* closed: show only the toggle (plus titles/search fields in toolbars) */
.post-actions.af-closed > button:not(.af-toggle),
.post-actions.af-closed > span:has(button) { display: none; }
.pe-versions.af-closed > :not(.af-toggle),
.draft-list.af-closed > :not(.af-toggle) { display: none; }
.pe-versions.af-closed, .draft-list.af-closed { gap: 0; }


/* ---- footage contact-sheet browser ---- */
.fg-folder { margin: 6px 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); padding: 0 12px; }
.fg-folder > summary { cursor: pointer; padding: 10px 2px; font-weight: 600;
  list-style: none; }
.fg-folder > summary::-webkit-details-marker { display: none; }
.fg-folder > summary::before { content: "▸ "; color: var(--dim); }
.fg-folder[open] > summary::before { content: "▾ "; }
.fg-count { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
.fg-folder-body { padding: 2px 0 10px; }
.fg-folder .fg-folder { background: var(--panel2); }
.fg-clip { padding: 8px 2px; border-top: 1px solid var(--line); }
.fg-clip:first-child { border-top: none; }
.fg-name { font-size: 13px; font-family: var(--font-mono, ui-monospace, monospace);
  margin-bottom: 6px; }
.fg-size { color: var(--dim); font-size: 11px; margin-left: 8px; }
.fg-strip { display: flex; gap: 6px; overflow-x: auto; }
.fg-cell { flex: 0 0 auto; width: 160px; aspect-ratio: 16/9; background: var(--fill);
  border-radius: 8px; overflow: hidden; }
.fg-cell img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
.fg-cell.bad { display: none; }
.fg-big { max-width: 100%; border-radius: 10px; }
@media (max-width: 700px) { .fg-cell { width: 124px; } }

/* ---- footage: search bar, marks, captions ---- */
.fg-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.fg-bar input[type=search] { flex: 1 1 240px; min-width: 180px; padding: 8px 12px;
  background: var(--fill); border: 1px solid var(--line); border-radius: 999px;
  color: var(--text); }
.fg-markfilter { display: inline-flex; gap: 4px; }
.fg-mf { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--fill); cursor: pointer; font-size: 10px; color: var(--dim);
  padding: 0; line-height: 1; }
.fg-mf.none { width: auto; border-radius: 999px; padding: 0 12px; font-size: 12px; }
.fg-mf.green { background: #3ecf8e55; } .fg-mf.yellow { background: #f5c84c55; }
.fg-mf.red { background: #ff5a3c55; }
.fg-mf.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft, transparent); }
.fg-capstatus { font-size: 12px; color: var(--dim); }
.fg-dot, .fg-dot-demo { display: inline-block; width: 13px; height: 13px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--fill); cursor: pointer;
  vertical-align: -1px; margin-right: 6px; padding: 0; }
.fg-dot.green, .fg-dot-demo.green { background: #3ecf8e; border-color: #3ecf8e; }
.fg-dot.yellow, .fg-dot-demo.yellow { background: #f5c84c; border-color: #f5c84c; }
.fg-dot.red, .fg-dot-demo.red { background: #ff5a3c; border-color: #ff5a3c; }
.fg-dot-demo { cursor: default; margin: 0 2px; }
.fg-clip.marked-green { border-left: 3px solid #3ecf8e; padding-left: 8px; }
.fg-clip.marked-yellow { border-left: 3px solid #f5c84c; padding-left: 8px; }
.fg-clip.marked-red { border-left: 3px solid #ff5a3c; padding-left: 8px; opacity: .6; }
.fg-cap { display: block; color: var(--dim); font-size: 12px; font-family: inherit;
  margin-top: 2px; font-weight: 400; }
.fg-crumb { font-size: 11px; color: var(--dim); margin: 10px 0 2px; }
.fg-hit { border-top: 1px solid var(--line); }

/* NUEVO NORTE — capa propia sobre tokens.css + style.css.
   Tono: sobrio, editorial, de cinemateca. Un solo acento (chinagraph),
   mucho aire, tipografía con jerarquía clara. Funciona en ambos temas. */

/* el atributo hidden siempre gana, incluso sobre .login{display:flex} */
[hidden]{display:none!important}

/* login gate a pantalla completa */
#gate{position:fixed;inset:0;z-index:2000}
body.gate #gate{display:flex}

/* el wordmark NUEVO NORTE es ancho — tipo más chico, más aire para la nav */
.tomo-logo h1{font-size:22px}
.tomo-logo{top:26px}

/* barra superior: secciones a la izquierda, controles a la derecha */
#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;padding:22px 32px 0 214px;background:color-mix(in oklab,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#topbar .psecnav{border-bottom:none;margin:0}
/* pestañas con la misma tipografía que el wordmark NUEVO NORTE, sin subrayado de acento */
#topbar .psec{font-family:var(--cond);font-weight:800;font-size:19px;
  text-transform:uppercase;letter-spacing:-.02em}
#topbar .psec.active{border-bottom-color:transparent}
/* hover tricolor estilo TOMO en las pestañas (el sub-nav lo tiene en su propia regla) */
#topbar .psec:hover{color:var(--hovc,var(--ink));border-color:transparent}
.topctl{display:flex;gap:8px;align-items:center;padding-bottom:8px}

main{padding:26px 32px 110px;max-width:1120px;margin:0 auto}
.loading{color:var(--dim);font-family:var(--font-mono);font-size:var(--fs-sm);padding:60px 0;text-align:center}

/* ── documentos (plan / identidad) y contenedor editorial común ── */
.doc{max-width:780px;margin:0 auto}
.doc-sub{font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:var(--ls-edge);
  text-transform:uppercase;color:var(--dim);margin:6px 0 4px}
.doc h1{font-size:var(--fs-display);line-height:var(--lh-tight);letter-spacing:var(--ls-display);
  margin:10px 0 26px}
.doc h2{font-size:var(--fs-h1);margin:52px 0 14px;padding-top:22px;border-top:1px solid var(--line)}
.doc h3{font-size:var(--fs-h2);margin:30px 0 8px}
.doc h4{font-size:var(--fs-h3);margin:22px 0 6px}
.doc p{line-height:var(--lh-body);color:var(--text);margin:12px 0}
.doc li{line-height:var(--lh-body);margin:7px 0}
.doc ul,.doc ol{padding-left:22px}
.doc code{font-family:var(--font-mono);font-size:.92em;background:var(--fill);
  border-radius:var(--r-sm);padding:1px 5px}
.doc hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.doc em{font-style:italic}
.doc blockquote{margin:22px 0;padding:14px 0 14px 22px;border-left:3px solid var(--accent)}
.doc blockquote p{margin:0;font-size:var(--fs-h3);line-height:1.5;color:var(--text)}
.doc .tblwrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:var(--r-md)}
.doc table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.doc th{background:var(--panel-2);text-align:left;padding:9px 13px;font-size:var(--fs-2xs);
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.doc td{padding:9px 13px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.5}
.doc tr:last-child td{border-bottom:none}

/* sub-nav de secciones (## del markdown) */
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 6px;
  padding:10px 0;background:color-mix(in oklab,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
/* fijado bajo el topbar mientras se scrollea el documento (lo controla el JS) */
.secnav.stuck{position:fixed;z-index:6;background:color-mix(in oklab,var(--bg) 96%,transparent)}

/* pantallas anchas: el menú vive fijo en la columna izquierda libre y
   acompaña el scroll; los botones se vuelven líneas de texto, estilo TOMO */
@media (min-width:1240px){
  .secnav{position:fixed;z-index:6;top:118px;left:max(20px,calc((100vw - 780px)/2 - 212px));
    width:184px;flex-direction:column;align-items:flex-start;gap:2px;
    margin:0;padding:0;border-bottom:none;background:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:none}
  .secnav::-webkit-scrollbar{display:none}
  .secnav .secnav-a{border:none;background:none;border-radius:0;text-align:left;
    padding:4px 0;line-height:1.45}
  .secnav-spacer{display:none}
}

/* los anclajes de sección aterrizan debajo del menú/topbar al navegar */
#view [id^="s-"]{scroll-margin-top:var(--anchor-off,120px)}
.secnav-a{border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;
  border-radius:var(--r-round);padding:4px 11px;font-size:var(--fs-2xs);letter-spacing:var(--ls-edge);
  text-transform:uppercase;font-family:var(--font-mono)}
.secnav-a:hover{color:var(--hovc,var(--accent));border-color:var(--hovc,var(--accent))}

/* ── timeline por fases ── */
.tl{max-width:820px;margin:0 auto;position:relative;padding:14px 0 40px 30px}
.tl::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--accent),var(--line) 92%,transparent)}
.tl-node{position:relative;margin:0 0 34px;padding-left:26px}
.tl-node::before{content:"";position:absolute;left:-27px;top:5px;width:14px;height:14px;
  border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.tl-when{font-family:var(--font-mono);font-size:var(--fs-2xs);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.tl-when .ph{color:var(--accent);font-weight:800;margin-right:10px}
.tl-node h3{margin:2px 0 8px;font-size:var(--fs-h2)}
.tl-node p{margin:0;line-height:var(--lh-body);color:var(--text);font-size:var(--fs-sm)}
.tl-gate{display:inline-block;margin-top:12px;font-size:var(--fs-xs);font-family:var(--font-mono);
  color:var(--gold);background:var(--gold-soft);border:1px solid color-mix(in oklab,var(--gold) 40%,transparent);
  border-radius:var(--r-pill);padding:6px 12px;line-height:1.5}
.tl-end{padding-left:26px;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--dim);
  letter-spacing:var(--ls-edge);text-transform:uppercase;line-height:1.6}

/* hitos con badge de track */
ul.hitos{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line-2)}
ul.hitos li{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line-2);font-size:var(--fs-sm);line-height:1.5}
.hito-when{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--dim);
  letter-spacing:var(--ls-edge);min-width:104px}
.hito-title{flex:1;min-width:200px}
.track{font-size:9px;font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none;
  border:1px solid var(--line);color:var(--dim)}
.t-cine{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 50%,transparent);
  background:var(--accent-soft)}
.t-comercial{color:var(--info);border-color:color-mix(in oklab,var(--info) 50%,transparent);
  background:var(--info-soft)}
.t-empresa{color:var(--gold);border-color:color-mix(in oklab,var(--gold) 50%,transparent);
  background:var(--gold-soft)}

/* ── tareas (checklist de arranque) ── */
.tk-prog{display:flex;align-items:center;gap:12px;margin:16px 0 10px}
.tk-bar{flex:1;height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.tk-bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s var(--ease)}
.tk-count{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--dim);white-space:nowrap}
.tk-grouphead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  margin:44px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
.tk-grouphead h2{margin:0;padding:0;border:none;font-size:var(--fs-h2)}
.tk-gcount{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--dim);white-space:nowrap}
.tk-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin:10px 0;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.tk-item.crit{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));
  box-shadow:inset 3px 0 0 var(--accent)}
.tk-item.done{opacity:.55}
.tk-item.done .tk-title{text-decoration:line-through}
.tk-check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:var(--r-round);
  border:2px solid var(--line);background:none;color:var(--on-accent);font-size:14px;
  line-height:1;cursor:pointer;padding:0}
.tk-check:hover{border-color:var(--accent)}
.tk-item.done .tk-check{background:var(--ok);border-color:var(--ok)}
.tk-body{flex:1;min-width:0}
.tk-title{font-weight:700;margin-bottom:4px;line-height:1.4}
.tk-detail{font-size:var(--fs-sm);color:var(--dim);line-height:1.55}

.e-desarrollo{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 50%,transparent);background:var(--warn-soft)}
.e-abierto{color:var(--dim);border-color:var(--line);background:var(--fill)}
.proj-log{font-size:var(--fs-h3);line-height:1.55;color:var(--text);margin:16px 0 4px}
.proj-sec{margin-top:16px}
.proj-sec h4{margin:0 0 6px;font-size:var(--fs-2xs);font-family:var(--font-mono);

ol.ruta{margin:0;padding-left:20px}
ol.ruta li{font-size:var(--fs-sm);line-height:1.55;margin:5px 0}

.chip{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:999px;padding:3px 10px;

.proj-next{margin-top:20px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);

  line-height:var(--lh-body)}
.proj-next .lbl{display:block;font-family:var(--font-mono);font-size:var(--fs-2xs);
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent);margin-bottom:4px}

/* ── comercial ── */
.comercial .nota{font-size:var(--fs-h3);line-height:1.6;color:var(--dim);margin:14px 0 26px;

dl.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0;
