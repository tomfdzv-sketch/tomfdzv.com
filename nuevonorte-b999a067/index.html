<script>window.NN_DATA = {"plan": "# NUEVO NORTE — Plan de negocio\n\n## Resumen ejecutivo\n\n**Nuevo Norte** es una casa productora de cine con sede en la Ciudad de México. Su razón de ser es producir **largometrajes de ficción y documental de autor** con vocación de festival y circulación internacional. Para sostener esa misión sin traicionarla, la casa se mantiene con **encargos de producción** — principalmente **producir cine de otros** (servicios de producción, line production, coproducción ejecutiva) y, cuando conviene, trabajo comercial selectivo (spots, institucionales, videoclips).\n\nLa tesis: **la operación se paga produciendo — para otros primero, para marcas cuando convenga — y el cine propio se financia con fondos públicos y coproducción** (EFICINE, IMCINE, Ibermedia, fondos europeos vía coproducción). La ventaja de que el encargo central sea *cine ajeno* y no publicidad: cada service o line production desarrolla exactamente las capacidades que nuestras propias películas necesitan (presupuestos, crew, logística de rodaje, entregables internacionales) y construye relaciones con las productoras y estudios con los que después coproduciremos. La casa arranca con **MXN 4,000,000 de capital**, que paga la operación completa — sueldos fijos de los socios incluidos — durante los primeros ~24 meses, mientras la cartera de encargos crece hasta sostenerla.\n\nHorizonte del plan: **5 años**. La meta al año 5: **4–6 largometrajes con el crédito de la casa** — dos proyectos principales (Radio Betania, coproducción acreditada vía García Bross y estrenada en festival clase A; y el proyecto NN #3 con Nuevo Norte como productora principal y fondos solicitados **directamente a nombre propio**), 1–2 documentales del carril ágil, y 1–2 coproducciones minoritarias — más una cartera de encargos estable que cubra el 100% de los gastos fijos. El volumen no sale de esperar más veces al mismo fondo: sale de operar **tres carriles de producción en paralelo** (ver \"Los tres carriles de producción\").\n\n## Visión y tesis\n\n**Qué somos.** Una productora de cine de autor: ficción y documental con mirada personal y ambición internacional. Nos interesan las películas que nacen de una obsesión verdadera de quien las dirige — no de una fórmula ni de una tendencia — y que buscan una forma propia de contar: el tono, el ritmo, la imagen y el sonido decididos por lo que la historia pide. Todo eso sostenido por una manera de trabajar seria y profesional: desarrollo en forma, presupuestos reales, palabra cumplida y entregas a tiempo.\n\n**Qué no somos.** No somos una agencia de contenido que \"algún día\" hará cine, ni una casa de spots con un cajón de guiones. El orden de prioridades está fijado desde el acta fundacional: el slate (la cartera de proyectos propios) define el calendario del año; los encargos — sean películas ajenas o comerciales — se agendan alrededor de él, nunca al revés.\n\n**Por qué ahora.** El núcleo fundador ya tiene un largometraje en desarrollo activo (*Radio Betania*, ruta EFICINE con ventana de post en julio 2027), materiales de carrera al día, y experiencia real en desarrollo, producción y post. Falta la estructura: una empresa que acumule el track record, los créditos y las relaciones — en lugar de que cada proyecto empiece de cero.\n\n**Los tres principios operativos:**\n\n1. **Las películas propias no pagan la operación; los encargos sí.** Ningún gasto fijo de la empresa se cuelga del presupuesto de una película propia (nuestras películas sí dejan ingreso legítimo — el fee de producción de 7–10% y los salarios de los socios dentro del presupuesto — pero la operación no depende de que una película exista). El capital de arranque (MXN 4M) paga la operación — sueldos incluidos — los primeros dos años; a partir de ahí la sostienen los encargos.\n2. **Track record antes que ego.** En los primeros años Nuevo Norte coproduce y se acredita junto a productoras establecidas (ver ruta García Bross). Firmar en segunda posición hoy es lo que permite firmar en primera mañana.\n3. **Cada peso de encargo compra tiempo de desarrollo.** Un porcentaje fijo del margen de los encargos (proponemos 20%) se transfiere cada trimestre a un **fondo de desarrollo** interno: escritura, registro de guiones, carpetas, subtitulaje, inscripciones a labs y mercados.\n\n## Modelo de negocio: dos motores\n\n### Motor A — Encargos (el que genera caja)\n\nEl motor de caja es **producir para otros**, con esta jerarquía deliberada (detalle y rangos en la pestaña **Encargos**):\n\n1. **Servicios de producción y line production de cine** — la fuente preferida: producciones extranjeras o de otras productoras que ruedan en México y necesitan una casa local confiable (permisos, crew, presupuesto, logística). Paga bien, desarrolla las capacidades exactas que requieren nuestras películas y construye relaciones de coproducción.\n2. **Coproducción ejecutiva** — gestionar la pata mexicana de películas ajenas por un fee, además del crédito (se traslapa con el carril de copro minoritaria de \"Los tres carriles de producción\").\n3. **Comercial selectivo** — spots, institucionales, videoclips y contenido cuando el proyecto, el margen o la relación lo ameriten. No se descarta ni se persigue: se acepta el trabajo que pague bien y no interfiera con el slate.\n4. **Trabajo freelance de los socios — con relevo.** Los primeros años los socios siguen aceptando proyectos externos (dirección, fotografía, edición para otros); es ingreso legítimo y construye relaciones. La regla acordada: si un proyecto externo retira a un socio de la operación por semanas o meses (p. ej. cuatro meses de rodaje), la casa **subcontrata a alguien que cubra sus funciones durante ese periodo y le paga la remuneración que correspondía al socio** — el socio no cobra doble, la operación no se detiene, y su puesto y participación lo esperan al volver.\n\nMetas del motor A:\n- **Año 1:** 4–6 encargos facturados — piso de 4, meta de 6 —, concentrados fuera de la ventana de rodaje y post de Radio Betania (marzo–julio 2027). El capital paga la operación; cada encargo cobrado extiende la pista.\n- **Año 2:** 6–10 encargos facturados; primer service o line production de cine completo entregado; la facturación se acerca al punto de equilibrio operativo (~MXN 365,000/mes).\n- **Año 3–5:** cartera con 2–3 relaciones recurrentes (productoras que repiten service, algún cliente comercial estable) que aporten el 50% del ingreso de encargos, para reducir la varianza.\n\n### Fotograma: el brazo de renta de la casa\n\n**Fotograma** — el proyecto de rentadora de equipo de cine, que ya tiene plan de negocio y tarifario propios — no entra a este plan como empresa aliada ni como socio externo: **es de los mismos cuatro socios y opera como un brazo de Nuevo Norte**. Hoy no está constituida como empresa; arranca como marca y línea de negocio dentro de la casa, y se evalúa convertirla en filial propia cuando su volumen lo justifique (compatible con el Escenario 3 de estructura: empresa operadora + vehículos).\n\nQué le aporta a la casa:\n\n1. **Margen en los encargos.** El paquete de cámara y equipo de cada service, spot o institucional se queda en casa en lugar de pagarse a una rentadora externa — el costo directo baja y el margen del encargo sube.\n2. **Ingreso propio.** La renta a terceros (producciones ajenas, otros crews) es una línea de facturación adicional con su propio tarifario, independiente de que la casa esté produciendo o no.\n3. **Cine en especie: equipo que compra coproducción.** Es práctica común en el cine mexicano que una rentadora entre a una película como **coproductora en especie**: en lugar de dinero, aporta semanas de equipo valuadas a tarifa, y ese valor se convierte en un **porcentaje de la película y un crédito de coproducción** — igual que si hubiera puesto el efectivo equivalente. Para la casa esto funciona en dos direcciones. Hacia adentro: en las películas propias (el carril documental primero, donde la cámara es de los costos grandes), el equipo de Fotograma reduce el efectivo que hay que levantar. Hacia afuera — y aquí está lo potente —: el carril de **coproducción minoritaria** se puede pagar con fierros en lugar de caja. Una película ajena que necesita cámara recibe el paquete de Fotograma, y Nuevo Norte recibe a cambio porcentaje, crédito y relación — es decir, **el brazo de renta se vuelve una máquina de comprar coproducciones sin gastar efectivo**. Cada aportación se valúa por escrito a tarifa, se firma en el convenio de coproducción de esa película, y se aprueba entre socios con la misma regla que cualquier inversión.\n4. **Ventas cruzadas.** Una producción extranjera que llega a México necesita casa productora local y equipo: Nuevo Norte y Fotograma lo venden en una sola cotización, y cada cliente de renta es un prospecto de producción (y viceversa).\n\n**La regla de capital — la importante:** el inventario de equipo **no se compra con la pista de operación**. Los MXN 4,000,000 pagan sueldos y gastos fijos; Fotograma requiere su propio plan de inversión, separado y por etapas. Toda compra de equipo se aprueba entre socios como inversión documentada — la misma disciplina que rige las inversiones en películas — y nunca compromete la pista mínima de 12 meses.\n\n**Inversión por etapas (la secuencia de arranque):**\n\nUna precisión honesta antes de la secuencia: rentarse el equipo a uno mismo **retiene margen, no genera dinero nuevo** — el renglón de equipo del encargo se queda en casa en lugar de pagarse fuera, y eso es valioso, pero es el mismo bolsillo. El dinero nuevo aparece cuando Fotograma renta a **terceros**, y atender terceros es una operación completa (bodega, seguro, prep, logística, alguien que la corra). Además, la producción propia por sí sola no justifica una flota: 4–6 encargos al año son del orden de 15–25 días de renta interna — una fracción de los días facturados que necesita cada equipo para pagarse. Por eso el arranque es por etapas, con evidencia entre cada una:\n\n1. **Etapa 1 — Producir, anotar y evaluar (año 1).** Los encargos rentan equipo fuera, y la casa registra exactamente qué fierros paga más veces y a qué tarifa. Con esos datos en la mesa, los socios **evalúan si conviene alguna compra de equipo desde el primer año** — si un fierro se está pagando tantas veces que comprarlo es evidente, se adelanta; si no, se espera. La decisión sale del registro, no del entusiasmo.\n2. **Etapa 2 — Compra quirúrgica (año 1–2).** Con esa evidencia, los socios compran los 3–5 equipos de mayor rotación — inversión pequeña y etiquetada, que se amortiza con trabajo que ya existe. Aquí arranca la renta a terceros en corto (crews conocidos, producciones amigas) para empezar a medir utilización externa.\n3. **Etapa 3 — Levantar capital con prueba (año 2–3).** Con 6–12 meses de datos de utilización (interna + externa), se busca inversión externa para la flota completa. El pitch deja de ser una promesa (\"creemos que va a rentar\") y se vuelve un hecho (\"esto ya renta X días al mes; el capital escala lo probado\"). La entrada del inversionista se estructura como **filial**: Fotograma constituida como empresa propia, con Nuevo Norte como socia mayoritaria y el inversionista en minoría — exactamente el esquema del Escenario 3 de estructura (empresa operadora + vehículos).\n\nLo que esta secuencia evita deliberadamente: levantar dinero y comprar flota completa en el año en que los socios deben sacar el convenio de García Bross, los primeros encargos y el rodaje de *Radio Betania*. Una rentadora sin nadie que la opere de tiempo completo no es un negocio: es capital dormido depreciándose. Fotograma escala cuando su demanda — y la persona que la va a correr — existan.\n\n### Motor B — Cine (el que da sentido)\n\nEl cine se financia con **dinero de fondos, estímulos y coproducción — no con la caja de la empresa**. Fuentes por orden de prioridad para una productora mexicana emergente:\n\n| Fuente | Qué es | Cuándo aplica |\n|---|---|---|\n| **EFICINE 189** | Estímulo fiscal: contribuyentes de ISR aportan a tu película a cambio de crédito fiscal (hasta 20 MDP por proyecto) | Ya en marcha para *Radio Betania* vía García Bross; ventana de postproducción, julio 2027 |\n| **IMCINE (Focine)** | Apoyos directos a desarrollo, producción y postproducción | Desarrollo: desde año 1. Producción: cuando NN tenga el largo acreditado |\n| **Ibermedia** | Fondo iberoamericano a coproducción y desarrollo | Vía coproducción con socio iberoamericano; en *Radio Betania* la ruta MX–ES la abre la codirección española de ese proyecto |\n| **Fondos europeos** | CNC Aide aux cinémas du monde, fondos regionales españoles, Hubert Bals, World Cinema Fund | Vía coproducente europeo — relación que se construye proyecto por proyecto en mercados y foros de coproducción |\n| **Labs y mercados** | Morelia, GIFF, Ventana Sur, San Sebastián (Foro), Berlinale Talents | Cada proyecto del slate pasa por al menos un lab/mercado antes de rodar |\n\n### Programa de mercados y labs: el trabajo que alimenta los dos motores\n\nLa presencia en mercados no es un trámite por proyecto: es **un programa permanente de la casa, con presupuesto y calendario propios**. Las productoras de autor que llegan a ser referencia se construyen así — el productor vive en el circuito hasta que su nombre es garantía. Y el mismo viaje alimenta los dos motores: en un mercado se consiguen los services y line productions (Motor A), las coproducciones minoritarias, y el prestigio y las relaciones que financian el cine propio (Motor B).\n\n**El circuito anual mínimo** (a confirmar cada año según convocatorias): Morelia (octubre) y Ventana Sur (diciembre) como obligatorios desde el año 1; GIFF y Guadalajara como plazas nacionales de bajo costo; San Sebastián y el circuito europeo a partir del año 2; Producers Network de Cannes cuando haya proyecto que lo amerite.\n\n**Presupuesto:** ~**MXN 100,000–150,000 al año** — viajes, acreditaciones, inscripciones a labs y mercados, materiales impresos. Los años 1–2 se paga de la **reserva** del capital (~373,000, que cubre dos años de programa sin tocar la pista de operación); a partir del año 3, del margen de encargos y del fondo de desarrollo, que ya contempla inscripciones.\n\n**Responsable y regla:** el perfil P encabeza el programa (con C cuando el objetivo del viaje sea vender service). Cada viaje termina con un registro de contactos y seguimientos — un mercado del que no se regresa con relaciones documentadas es un viaje, no trabajo.\n\n### Los tres carriles de producción\n\nEl riesgo típico de una productora nueva es concentrar todo su esfuerzo en un solo largometraje de ficción y pasar cinco años esperándolo. Los fondos de ficción tardan lo que tardan — pero nada obliga a que la casa produzca **solo eso**. Nuevo Norte opera tres carriles con velocidades distintas:\n\n| Carril | Qué es | Ciclo típico | Cuántas en 5 años |\n|---|---|---|---|\n| **Proyecto principal** (ficción o documental) | Los largometrajes principales de la casa: EFICINE/Focine + coproducción internacional. Radio Betania con NN como coproductora acreditada (vía García Bross); el proyecto NN #3 ya con NN como productora principal | 2–3 años por película | **2** (Radio Betania + proyecto NN #3) |\n| **Documental ágil** | Largos documentales propios: presupuestos menores, crew mínimo, se ruedan mientras el proyecto principal espera resolución de fondos; financiamiento mixto (Focine-doc, fondos internacionales de doc, caja de desarrollo) | 1–2 años por película | **1–2** |\n| **Coproducción minoritaria** | Entrar con 5–20% en películas ajenas (México o Iberoamérica) que necesitan la pata mexicana o la europea que nosotros tenemos: crédito, relaciones y participación sin cargar el financiamiento completo | 6–18 meses de compromiso | **1–2** |\n| **Total** | | | **4–6 largometrajes con el crédito de la casa en los 5 años** |\n\nEl carril documental es además el que **el equipo ya sabe hacer barato**: es cine de resistencia — cámara propia, crew de 2–4, rodaje por bloques. Es el que garantiza que la casa esté *siempre rodando algo suyo*, que el reel de cine crezca cada año y que ningún año dependa del humor de un comité. Y no es un carril menor: **No Ficción** (Elena Fortes y Daniela Alatorre) demostró que una casa mexicana puede construir su prestigio internacional desde el documental — *Midnight Family* en Sundance, *Una película de policías* en Berlinale. Ese es el techo al que apunta este carril, no la nota al pie.\n\n**Una aclaración de vocabulario, para leer todo el plan sin confusión.** El **slate** (la cartera) son únicamente los proyectos donde Nuevo Norte es la **casa creativa**: los origina o los desarrolla, decide su ruta y responde por ellos — los dirija un socio o talento externo elegido por la casa. Las **coproducciones minoritarias** son otra cosa: películas **ajenas** — otra productora las origina y las dirige — donde entramos con un porcentaje a cambio de crédito, participación y relaciones. No forman parte del slate ni pasan por su criterio de entrada (tienen el suyo: afinidad con la casa y condiciones razonables), pero **sí cuentan en la filmografía**: la meta de 4–6 largos con el crédito de la casa suma las dos canastas.\n\nRegla de los tres carriles: **cada año de la casa debe cerrar con al menos un largo en rodaje o en post** (del carril que sea). Si el proyecto principal está detenido en ventanilla, el documental o una copro llenan el año.\n\n## La ruta García Bross: cómo se construye el track record\n\nEl problema de toda productora nueva: **los fondos grandes exigen que la productora solicitante ya tenga un largometraje producido.** Sin largo no hay fondo; sin fondo no hay largo.\n\nNuestra salida, ya en marcha:\n\n1. ***Radio Betania* se solicita a EFICINE a través de García Bross**, productora establecida que sí cumple el requisito del largo previo. Ellos son la solicitante formal.\n2. **Nuevo Norte entra en los créditos y contratos como productora (coproductora)** de *Radio Betania*. Esto debe quedar **por escrito en el convenio de coproducción antes de someter el proyecto**: crédito en pantalla, porcentaje de copropiedad de la película, y derecho a usar la película como acreditación de trayectoria.\n3. Al terminar *Radio Betania*, **Nuevo Norte ya tiene un largometraje en su filmografía** y puede solicitar EFICINE, Focine-producción e Ibermedia **a nombre propio**. El requisito típico es haber *producido* un largo, no haberlo estrenado, así que la primera solicitud se somete **en las convocatorias de inicios de 2028** — en cuanto RB esté terminada y el crédito acreditado — con el proyecto NN #2 — sea cual sea el carril que tome — como candidato natural si es proyecto propio (verificar la redacción exacta del requisito en los lineamientos vigentes de cada convocatoria).\n\nEs una inversión: cedemos protagonismo y un porcentaje en la película uno para no pedir permiso en la película dos. El punto crítico a vigilar es **contractual**: el crédito de Nuevo Norte no puede ser un favor verbal — se negocia y se firma antes de la ventana de julio 2027.\n\n## Estructura societaria\n\n### Los cuatro perfiles del núcleo (3–4 socios)\n\nDefinimos **perfiles, no nombres** — cada perfil se asigna a la persona correcta, y una persona puede cubrir más de un perfil al inicio:\n\n| Perfil | Función | Responsable de |\n|---|---|---|\n| **D — Dirección / Desarrollo creativo** | Voz autoral de la casa | Slate, guiones, dirección, relación con talento, línea editorial |\n| **P — Producción** | Ejecución de los proyectos | Presupuestos, fondos y convocatorias, coproducciones, producción en set, entregables |\n| **C — Encargos / Nuevos negocios** | Generación de ingreso | Relaciones con productoras y estudios (service/line production), clientes y agencias, cotizaciones, cierres |\n| **O — Post / Operaciones** | Finalización, distribución y operación | Edición, color, flujo de post, distribución, pipeline técnico, equipo, administración diaria |\n\n*(Nota: esta estructura que propongo se necesita trabajar y desarrollar mejor, es solo un inicio.)*\n\n### Perfiles operativos vs. créditos creativos\n\nLos perfiles anteriores son **cargos de la empresa, no créditos creativos**. Para evitar el conflicto natural de que todos los socios quieran (y puedan) ser creativos, la casa opera con tres reglas:\n\n1. **El perfil define de qué respondes en la operación, no qué creas.** Tener el perfil P, C u O no excluye a nadie de dirigir, escribir o fotografiar: significa que, además de su trabajo creativo, esa persona responde por su área de la empresa.\n2. **Los créditos creativos se asignan proyecto por proyecto.** Cada proyecto del slate tiene su director, guionista y equipo creativo decididos para ese proyecto — no heredados del organigrama. El perfil D no dirige todas las películas de la casa: cuida la coherencia de la línea editorial y que el slate avance. Entre proyecto principal, documentales ágiles y encargos con autoría (videoclips, comercial), hay más lugares de dirección que socios.\n3. **El filtro es el proyecto, no la persona.** Un proyecto entra al slate si cumple el criterio de entrada (una historia que hable por nuestros valores cinematográficos + ruta de financiamiento verosímil), lo dirija el socio que lo dirija. Y cada película lleva una voz que responde por ella — no se dirige en comité.\n\n**Meta de casa (año 3–5): al menos un proyecto del slate dirigido por talento de fuera del núcleo de socios.** Las productoras de autor que se vuelven referencia no crecen solo filmando lo propio: crecen apostando por directores ajenos antes de que otros los vean — eso multiplica el slate más allá del tiempo de los socios, y convierte a la casa en un sello (una garantía de criterio) en lugar de un vehículo personal. El criterio de entrada es el mismo del punto 3; el compromiso de la casa con ese proyecto también.\n\n### Tres escenarios de estructura (a decidir entre socios)\n\n**Escenario 1 — Cuatro socios iguales (25/25/25/25).**\nSimple y fraterno. Riesgo: paraliza decisiones si hay empate 2–2 y no refleja aportes desiguales de tiempo o dinero. Recomendable solo si los cuatro entran con dedicación y aporte comparables.\n\n**Escenario 2 — Núcleo fundador + socio industrial (recomendado como punto de partida).**\n2–3 socios fundadores con mayoría clara (p. ej. 40/30/30 o 35/35/30) y el cuarto perfil como **socio industrial**: gana participación gradualmente (vesting a 4 años con cliff de 1 año) a cambio de trabajo, no de capital. Protege a la empresa si alguien se retira durante el primer año.\n\n**Escenario 3 — Empresa operadora + vehículo por película.**\nNuevo Norte (la empresa) es dueña de la marca, la cartera de encargos y el fondo de desarrollo; **cada largometraje se produce en un vehículo propio** donde entran los fondos y coproducentes con porcentajes específicos de esa película. Es como opera la industria; adoptarlo desde el año 2–3, cuando haya una película con dinero real dentro.\n\n**Reglas que van en el acuerdo de socios sin importar el escenario:**\n- Vesting de 4 años con cliff de 1 año para todos (nadie se lleva 25% por seis meses de entusiasmo).\n- Decisiones de slate (qué película se hace) requieren mayoría; decisiones existenciales (vender, disolver, endeudarse) requieren unanimidad o supermayoría.\n- Propiedad intelectual: los guiones desarrollados con el fondo de desarrollo son de la empresa.\n- Ausencias por proyecto externo: si un socio se ausenta semanas o meses por un trabajo ajeno, la casa subcontrata quien cubra sus funciones y le paga la remuneración que correspondía al socio; su puesto y su participación lo esperan al volver.\n### Figura legal\n\nRecomendación: **S.A.S.** (Sociedad por Acciones Simplificada) para arrancar — se constituye en línea, sin notario, costo cero, un trámite de días. Migrar a **S.A. de C.V.** cuando el primer contrato grande o un fondo lo exija (los fideicomisos de EFICINE suelen pedirlo — para *Radio Betania* la solicitante es García Bross, así que no nos urge). Nota sobre Radio Betania: García Bross ya existe como empresa y será la ERPI del proyecto (la Empresa Responsable del Proyecto de Inversión, la figura que ante EFICINE recibe y ejerce el estímulo). Eso no significa que la película sea solo suya: **la propiedad de Radio Betania es compartida entre Nuevo Norte y García Bross**, en el porcentaje que fije el convenio de coproducción. Por eso Nuevo Norte se constituye como entidad propia y separada — para ser copropietaria de la película con nombre y RFC propios, no un apéndice del vehículo de otra empresa.\n\n## Finanzas: capital de arranque (año 1–2, CDMX)\n\nFilosofía: **capital serio, estructura ligera.** La casa arranca con **MXN 4,000,000** de capital, lo que permite pagar **sueldos fijos a los socios desde el día uno** — la dedicación al proyecto no depende del trabajo freelance de cada quien. El sueldo base cubre el trabajo de operación de la casa; **cuando un socio además ocupa un rol en un proyecto** (dirigir, fotografiar, editar, producir un encargo o una película), **cobra aparte por ese rol, con cargo al presupuesto de ese proyecto** y a tarifa de mercado — igual que se le pagaría a cualquier profesional contratado para el puesto. La estructura se mantiene ligera en todo lo demás: sin oficina fija los primeros 12 meses, equipo de cámara en renta por proyecto — vía Fotograma, el brazo de renta de la casa, cuando arranque; renta externa mientras tanto.\n\n**Gastos de arranque (una vez):**\n\n| Concepto | MXN |\n|---|---|\n| Constitución S.A.S. + libros/actas | 0 – 5,000 |\n| Registro de marca ante IMPI (una clase) | ~5,500 |\n| Contador: alta SAT, e.firma, opinión de cumplimiento | 8,000 |\n| Identidad visual + web + reel de casa | 25,000 (o lo desarrollamos nosotros mejor) |\n| Kit de desarrollo (registros Indautor, dossiers, subtitulaje, impresiones) | 12,000 |\n| **Subtotal arranque** | **~55,000** |\n\n**Gastos fijos mensuales (año 1):**\n\n| Concepto | MXN/mes |\n|---|---|\n| Sueldos base de socios (4 × 30,000; esquema fiscal a definir con contador) | 120,000 |\n| Contabilidad e impuestos | 3,500 |\n| Software (a definir) | 2,500 |\n| Seguros y misceláneos | 2,000 |\n| **Subtotal fijo** | **~128,000/mes** |\n\n**Distribución del capital de MXN 4,000,000:**\n\n| Destino | MXN |\n|---|---|\n| Gastos de arranque (una vez) | ~55,000 |\n| 24 meses de operación con sueldos (128,000 × 24) | ~3,072,000 |\n| Colchón de producción (anticipos de equipo y crew de los encargos) | 500,000 |\n| Reserva | ~373,000 |\n| **Total** | **MXN 4,000,000** (≈ US$230,000) |\n\nEl capital da **~24 meses de pista con la operación completa pagada** — sueldos incluidos — sin depender de un solo peso facturado. Cada encargo cobrado extiende esa pista. El colchón de producción existe porque los encargos se cobran 50% anticipo / 50% contra entrega, y la casa adelanta renta de equipo y crew.\n\n### El capital: la pregunta abierta del plan\n\nHay que decirlo con claridad: **los MXN 4,000,000 todavía no existen.** Todo lo anterior — sueldos desde el día uno, 24 meses de pista, colchón de producción — depende de reunirlos, y es la primera decisión real entre socios. Tres escenarios:\n\n**Escenario A — Capital completo entre socios (el plan tal cual).** Los socios reúnen los 4M (en partes iguales o no; la participación se fija en proporción a lo aportado). Es el escenario que este documento describe. Requiere que cada socio diga un número concreto antes de firmar nada.\n\n**Escenario B — Capital parcial (p. ej. MXN 2,000,000–2,500,000).** El plan se ajusta, no se cancela: sueldos escalonados (p. ej. 2 socios de tiempo completo con sueldo y 2 en transición freelance con relevo), pista de 12–15 meses en lugar de 24, y el punto de equilibrio se persigue desde el año 2 por necesidad. Más frágil, pero honesto si los 4M no aparecen.\n\n**Escenario C — Socio capitalista externo.** Un inversionista aporta parte del capital a cambio de participación **minoritaria y sin voto en decisiones de slate** (qué películas se hacen no se comparte con el dinero). Exige el Escenario 3 de estructura (empresa operadora + vehículos por película) casi de inmediato, y un acuerdo de socios más duro. Se explora solo si A y B no alcanzan.\n\nRegla: **este plan no se firma ni se constituye la sociedad hasta que el escenario de capital esté decidido y cada aporte tenga nombre, monto y fecha.**\n\n**Punto de equilibrio:** con margen promedio de ~35% sobre venta, cubrir MXN 128,000 fijos requiere facturar ~MXN 365,000/mes — nivel de una operación de encargos ya rodada, no de una casa recién constituida. Por eso el plan no exige equilibrio el año 1: **el capital paga la operación mientras se construye la cartera**, y la meta es acercarse al equilibrio operativo durante el año 2 y alcanzarlo hacia el año 3, con los encargos grandes (service de cine, copro ejecutiva, spots) cargando la mayor parte.\n\n### ¿De dónde sale el dinero?\n\nLo que hay que cubrir cada mes son los **MXN 128,000 de gastos fijos** (120,000 de sueldos base + ~8,000 de operación). Los encargos no dejan todo lo que facturan — de cada proyecto se paga crew, renta de equipo, viáticos y post; a la casa le queda el **margen, ~35% de la venta**. Para que ese margen cubra los fijos, hay que facturar **~MXN 365,000 al mes** (128,000 ÷ 0.35), que con las tarifas de la pestaña de Encargos se arma, por ejemplo, así:\n\n| Mezcla de ejemplo (un mes) | Facturación aproximada |\n|---|---|\n| 1 spot mediano | 350–400k |\n| 1 semana de service de cine (90k) + 1 institucional grande (160k) + 1 retainer de redes (90k) | ~340k |\n| 1 fee de copro ejecutiva (200k, repartido en meses) + 2 institucionales | ~350k |\n\nEs decir: el equilibrio equivale a **un encargo grande al mes, o dos o tres medianos, sostenido todo el año** (~MXN 4.4 millones facturados anuales). La ruta para llegar: en el año 1 (4–6 encargos) la facturación cubre una fracción y el capital paga la diferencia; en el año 2 (6–10 encargos + primer service de cine completo) la facturación se acerca; hacia el año 3 los encargos grandes cargan la mayor parte y se alcanza el equilibrio.\n\nAdemás de los encargos, la casa tiene **dos ingresos que no dependen de la venta comercial:**\n\n1. **El fee de producción de las películas propias.** Cuando una película se financia (EFICINE, fondos, coproducción), su presupuesto incluye un fee del 7–10% para la productora, más los sueldos de los socios que ocupen roles en ella. Producir el cine propio con dinero de fondos también deja ingreso.\n2. **Lo que las películas regresen.** Ventas, distribución y participación en coproducciones. Es un ingreso tardío e impredecible — el plan no cuenta con él para pagar la operación, pero existe y se acumula con el catálogo.\n\n**Qué hace la empresa con su caja.** El capital tiene tres usos, en este orden de prioridad:\n\n1. **Operación** — sueldos y fijos. Es el uso protegido: la casa mantiene siempre una **pista mínima de 12 meses de operación intocable**.\n2. **Inversión en proyectos propios** — la caja puede aportar dinero a las películas del slate (desarrollo, arranque de rodaje, completar un financiamiento) como **inversión de la empresa en ese proyecto**, documentada con su propio contrato y su porcentaje, complementando fondos e inversionistas externos — no sustituyéndolos.\n3. **Coproducciones minoritarias ajenas** — entrarle con dinero a películas de otros para comprar participación, crédito y relaciones (el tercer carril de producción).\n\nRegla de disciplina: toda inversión en una película — propia o ajena — se aprueba entre los socios caso por caso, queda documentada como inversión de la empresa en ese proyecto específico, y **nunca compromete la pista mínima de 12 meses de operación**.\n\n## Riesgos y cómo los mitigamos\n\n| Riesgo | Mitigación |\n|---|---|\n| Los encargos absorben toda la capacidad de la empresa (el caso frecuente de la productora de service y spots que nunca produjo cine propio) | El fondo de desarrollo (20% del margen) y la revisión trimestral del slate son obligatorios por acuerdo de socios; el calendario del año se arma primero con los hitos de cine; la jerarquía de encargos prioriza el cine ajeno, que al menos desarrolla capacidades y relaciones |\n| El crédito de NN en *Radio Betania* se diluye o se queda en promesa | Convenio de coproducción firmado **antes** de someter a EFICINE (jul 2027); es la tarea número uno del track de cine |\n| Sequía de encargos (3+ meses sin proyectos) | Pista de ~24 meses de operación pagada con el capital; estructura ligera fuera de sueldos (sin oficina, equipo en renta); perfil C dedicado a traer trabajo, no \"cuando haya tiempo\" |\n| El capital se consume antes del punto de equilibrio | Revisión mensual de caja en la junta quincenal; regla de alarma: si al mes 18 la facturación no cubre el 50% de los fijos, se ajustan sueldos y estructura antes de tocar el colchón de producción |\n| Un socio se retira el primer año | Vesting con cliff de 1 año + derecho de preferencia |\n| El brazo de renta (Fotograma) consume capital de operación — cámaras en lugar de pista | Regla dura: los 4M no compran equipo; el inventario tiene plan de inversión propio, gradual y aprobado caso por caso entre socios |\n| Dependencia de un solo cliente de encargos | Regla: ningún cliente > 40% de la facturación anual a partir del año 2 |\n| Cambios en los fondos públicos (presupuesto, reglas) | Diversificación desde el diseño: EFICINE + Focine + Ibermedia + coproducción internacional, nunca una sola ruta por proyecto |\n", "identidad": "# NUEVO NORTE — Identidad y pitch\n\n## Manifiesto\n\n**Nuevo Norte** es una casa de cine.\n\nCreemos en el cine de autor como una forma de guía: una película reestructura el mapa de quien la ve.\n\nHacemos ficción y documental con mirada personal: películas que nacen de una obsesión verdadera de quien las dirige y que buscan una forma propia de contar — el tono, el ritmo, la imagen y el sonido decididos por lo que la historia pide. Y las producimos con una manera de trabajar seria y profesional: desarrollo en forma, palabra cumplida, entregas a tiempo.\n\nNos interesan las historias que solo pueden contarse desde donde estamos: México y sus fronteras — geográficas, familiares, de lengua y de clase. Las miramos de frente, sin exotismo ni condescendencia: no el país convertido en decorado para la mirada de fuera, sino el que se vive de cerca. Y creemos que el proceso es parte de la obra: cómo se investiga, cuánto tiempo se pasa con las personas y los lugares, cómo se trata a quienes están frente a la cámara y detrás de ella. Una película se parece siempre a la manera en que fue hecha.\n\nCada trabajo tiene su ritmo: el cine propio se trabaja con paciencia; los encargos, con oficio y puntualidad. La casa se sostiene produciendo: al principio, sobre todo cine de otros — services, line production, coproducciones — y publicidad cuando conviene; con los años, cada vez más el propio. Todo lo hacemos con el mismo ojo, y nada de eso lo confundimos jamás con la obra: financia la paciencia que nuestro cine exige.\n\nUna productora es, antes que una empresa, una **casa**: un lugar al que los proyectos y las personas quieren volver.\n\n## Posicionamiento\n\n**Categoría:** casa productora de cine de autor (ficción + documental), CDMX, que también produce para otros: services y line production de cine, coproducción ejecutiva y trabajo comercial selectivo.\n\n**Para quién existimos:**\n- **Fondos, festivales y coproducentes** — una productora mexicana emergente con proyectos sólidos, socios que ejecutan y vocación de coproducción internacional.\n- **Directores y guionistas** — una casa que desarrolla en serio: tiempo de escritura, carpeta profesional, estrategia de fondos y mercados por proyecto.\n- **Productoras y estudios (MX y extranjeros)** — una casa local confiable para rodar en México: permisos, crew, presupuesto, logística, pata mexicana de coproducción.\n- **Marcas y agencias** — un equipo de cine que pone lenguaje cinematográfico al servicio de una campaña: menos volumen, más autoría.\n\n**Contra qué nos definimos:** las productoras de publicidad que \"también hacen cine\" (el cine como actividad secundaria) y el cine precario que se rueda sin desarrollo ni ruta de financiamiento. Nuestro punto medio: **estructura de empresa, alma de cinemateca.**\n\n## Productoras modelo (referencias)\n\n| Casa | Por qué es referencia |\n|---|---|\n| **Piano** (MX) | La prueba mexicana de la tesis: cine de autor radical (Reygadas, Escalante) sostenido por estructura y coproducción internacional |\n| **Pimienta Films** (MX) | Producción mexicana de primer nivel internacional (*Roma*, *Noche de fuego*, *Tempestad*): coproducciones grandes, autores exigentes y presencia constante en clase A |\n| **No Ficción** (MX) | La casa de Elena Fortes y Daniela Alatorre: la prueba de que el documental de autor mexicano llega al más alto nivel (*Midnight Family* en Sundance, *Una película de policías* en Berlinale) — documental con ambición de cine, no de televisión |\n| **Cine Vendaval** (MX) | Generación emergente: pocos proyectos, desarrollo largo, presencia constante en labs y festivales clase A |\n| **CANADA** (ES) | Videoclips y publicidad con una identidad propia inconfundible: el trabajo comercial firmado con voz de autor, sin diluirse |\n| **Caviar / Division** (INT) | El brazo comercial hecho con estándar de cine: videoclips y publicidad que ganan premios y financian obra |\n| **Colectivo Colmena** (MX) | Cine en colectivo con proyección clase A: *Mostro*, *Todos los incendios* y *Lumbrensueño* estrenados en Venecia y Locarno, mención especial del jurado en Morelia 2023 — modelos alternativos de producción que acompañan la película de la escritura a la distribución |\n\nDe cada una tomamos algo: la tesis de financiamiento (Piano), el estándar de producción internacional (Pimienta), la altura del documental (No Ficción), la cadencia de desarrollo (Vendaval), la firma propia en el trabajo comercial (CANADA), el estándar comercial (Caviar), el trabajo en colectivo (Colmena).\n\n## One-pager de venta (pitch en 60 segundos)\n\n**Nuevo Norte** — casa productora de cine, Ciudad de México.\n\n- **Qué hacemos:** largometrajes de ficción y documental de autor; coproducciones con casas de México y el extranjero — de la pata mexicana completa a la participación minoritaria; services y line production para producciones que ruedan en México; publicidad y videoclips selectivos con acabado de cine.\n- **Quiénes somos:** núcleo de 3–4 socios que cubren dirección, producción, encargos y postproducción — la casa puede llevar una película completa del guion a la copia final.\n- **Qué tenemos hoy:** un largometraje en ruta de financiamiento EFICINE (*Radio Betania*, coproducción con García Bross, ventana de post julio 2027).\n- **Nuestra ventaja:** disciplina financiera — los encargos pagan la operación, el cine se financia con fondos y coproducción, nunca al revés — y un primer largometraje ya en ruta de financiamiento con coproducción internacional (*Radio Betania*).\n- **Qué buscamos** (según el interlocutor): coproducentes y agentes de ventas para el slate (la cartera de proyectos propios) / producciones que necesiten casa productora en México / marcas que quieran lenguaje de cine / talento con proyectos que necesiten casa.\n\n## Identidad visual\n\nA definir.\n", "comercial": {"nota": "Rangos pre-IVA, CDMX 2026, producción ligera (crew 3–8). El precio final siempre sale de un presupuesto por proyecto. Jerarquía deliberada de la casa: primero producir cine de otros (service / line production / copro ejecutiva), después el comercial selectivo — se acepta el trabajo que pague bien y no interfiera con el slate (la cartera de proyectos propios). Margen objetivo: 30–40% sobre venta después de costos directos.", "lineas": [{"id": "service", "nombre": "Service / line production de cine", "desc": "La fuente de ingreso preferida: producir en México r en marzo 2027 y arrancar la postproducción de inmediato con recursos propios — primer corte en mayo–junio — para someter a EFICINE en la ventana de postproducción de julio 2027 (la ruta de post exige llegar con corte, por eso el rodaje va primero). Y como el capital también es para producir, el desarrollo del slate arranca desde el año 1, incluida la búsqueda de la primera coproducción minoritaria como inversión de la casa.", "gate": "Puerta al Año 2: empresa constituida con capital depositado + convenio RB firmado + RB rodada y sometida a EFICINE-post + 4 encargos facturados", "hitos": [{"when": "Sep–Oct 2026", "title": "Constitución + acuerdo de socios firmado + capital de MXN 4M depositado (sueldos corriendo)", "track": "empresa"}, {"when": "Oct–Nov 2026", "title": "Identidad, web y reel de casa en línea", "track": "empresa"}, {"when": "Nov 2026", "title": "Primer encargo facturado (service, institucional o videoclip)", "track": "comercial"}, {"when": "Nov 2026 – Feb 2027", "title": "Convenio RB firmado + caja del rodaje levantada (inversión directa)", "track": "cine"}, {"when": "Mar–Abr 2027", "title": "Rodaje Radio Betania (NN en producción)", "track": "cine"}, {"when": "May–Jun 2027", "title": "Arranque de post de RB con recursos propios → primer corte", "track": "cine"}, {"when": "2027", "title": "Desarrollo del slate en marcha + búsqueda de la primera coproducción minoritaria (inversión de la casa)", "track": "cine"}, {"when": "Jul 2027", "title": "RB sometida a EFICINE 189 (ventana de postproducción) vía García Bross", "track": "cine"}, {"when": "Feb–Ago 2027", "title": "4–6 encargos año 1 (fuera de la ventana de RB)", "track": "comercial"}]}, {"type": "fase", "fase": "AÑO 2", "when": "Sep 2027 – Ago 2028", "title": "Postproducción de Radio Betania, desarrollo del slate", "body": "Si EFICINE-post aprueba: postproducción de Radio Betania con el estímulo (edición, color, sonido) y Nuevo Norte activa como coproductora. Los proyectos del slate entran a convoc res proyectos en etapas distintas: uno financiándose, uno en desarrollo, uno en escritura. Este slot se llena con el fondo de desarrollo interno (20% del margen de los encargos).", "rol_nn": "Productora — desarrollo propio o de talento cercano (la vía a producir óperas primas ajenas en el año 5).", "ruta": ["Fondo de desarrollo activo desde el primer trimestre con margen de encargos", "Revisión trimestral de slate: qué entra, qué avanza, qué se suelta", "Criterio de entrada: una historia que hable por nuestros valores cinematográficos + ruta de financiamiento verosímil"], "festivales_meta": [], "proximos_pasos": "Definir en la primera revisión trimestral de slate (tras la constitución)."}], "tareas": [{"id": "g0", "title": "Fase 0 — Decisiones entre socios (semanas 1–2, gratis)", "items": [{"id": "socios-perfiles", "title": "Asignar los 4 perfiles (D/P/C/O) a personas", "detail": "Reunirse los socios y asignar los perfiles: Dirección/Desarrollo, Producción, Encargos/Nuevos negocios, Post/Operaciones/Distribución. Una persona puede cubrir más de un perfil al inicio, pero cada perfil necesita UN responsable con nombre."}, {"id": "socios-escenario", "title": "Elegir escenario de estructura (1, 2 o 3 del plan)", "detail": "Decidir porcentajes y si hay socio industrial con vesting. Recomendado como punto de partida: escenario 2 (núcleo fundador + vesting 4 años, cliff 1 año)."}, {"id": "acuerdo-borrador", "title": "Acuerdo de socios en borrador", "detail": "Un documento sencillo antes del notario: quién pone cuánto del capital (MXN 4M total), porcentajes, vesting, reglas del slate — la cartera de proyectos propios — (mayoría) y de salida (derecho de preferencia). Escribirlo ahora que hay consenso entre los socios."}, {"id": "capital-compromiso", "title": "Comprometer el capital inicial por escrito", "detail": "MXN 4M en total; cuánto aporta cada socio está por definir en el acuerdo, con porcentajes de participación en proporción a lo aportado. Fechas de depósito y a qué cuenta; queda como capital social, no préstamo informal."}, {"id": "valores-cine", "title": "Definir los valores cinematográficos de la casa", "detail": "Desarrollar entre los socios qué valoramos en un proyecto: qué tipo de historias, qué forma, qué compromisos no negociables. Es la base del criterio de entrada al slate ('una historia que hable por nuestros valores cinematográficos') — mientras no esté escrito, el criterio queda abierto a interpretación.", "owner": "D"}, {"id": "fotograma-arranque", "title": "Decidir el arranque de Fotograma como brazo de renta", "detail": "Fotograma es de los mismos 4 socios y opera como brazo de la casa (no está constituida como empresa). Adoptar la inversión por etapas del plan: año 1 producir, registrar qué equipo se renta fuera y evaluar si conviene alguna compra desde el primer año; año 1–2 compra quirúrgica de los 3–5 fierros de mayor rotación; año 2–3 levantar capital externo con datos de utilización, como filial (NN mayoritaria + inversionista minoritario). Regla dura: los 4M de operación no compran equipo. El plan y tarifario de Fotograma ya existen como documentos propios.", "owner": "O"}]}, {"id": "g1", "title": "Fase 1 — Constitución y arranque (meses 1–2)", "items": [{"id": "sas", "title": "Constituir la S.A.S. en línea", "detail": "Trámite gratuito en el portal de Economía, sin notario. Nombre a reservar: Nuevo Norte (verificar disponibilidad y tener 2 alternativas).", "owner": "P"}, {"id": "sat", "title": "Alta SAT, e.firma y cuenta bancaria empresarial", "detail": "Con el contador: RFC de la sociedad, e.firma, opinión de cumplimiento, cuenta de banco a nombre de la empresa. Sin esto no se puede facturar el primer encargo.", "owner": "P"}, {"id": "contador", "title": "Contratar contador (iguala mensual)", "detail": "Presupuestado en MXN 3,500/mes. Que conozca el sector audiovisual (deducciones de producción, EFICINE) — pedir referencias a productoras amigas.", "owner": "P"}, {"id": "marca", "title": "Registrar la marca en el IMPI", "detail": "Wordmark NUEVO NORTE, clase 41 (producción audiovisual). ~MXN 5,500. Hacerlo antes de publicar la web.", "owner": "O"}, {"id": "identidad", "title": "Encargar identidad visual + web + reel de casa", "detail": "Presupuesto MXN 25,000 (o lo desarrollamos nosotros mejor). Dirección: sobrio, editorial, de cinemateca (ver pestaña Identidad). La web con slate, reel y contacto — es la carta de presentación ante fondos y clientes.", "owner": "D"}]}, {"id": "g2", "title": "Cine — Radio Betania (crítico, con fecha límite)", "items": [{"id": "rb-convenio", "title": "★ Firmar convenio de coproducción con García Bross", "detail": "LA tarea del año. Negociar y firmar ANTES de someter a EFICINE: crédito de Nuevo Norte en pantalla, porcentaje de copropiedad de la película, derecho a acreditar el largo como filmografía propia. Sin este papel firmado, todo el plan de track record es una promesa verbal. Meta: diciembre 2026.", "owner": "P"}, {"id": "rb-caja", "title": "Levantar la caja del rodaje de marzo 2027", "detail": "El rodaje se financia con inversión directa (no con el estímulo, que llega después): cerrar la aportación de Ferrecabsa como inversión + convocatorias de arranque + inversión de la propia casa si los socios la aprueban (ver reglas de caja del plan). Sin caja no hay rodaje; sin rodaje no hay corte para la ventana de post.", "owner": "P"}, {"id": "rb-carpeta", "title": "Cerrar carpeta de sometimiento EFICINE-post", "detail": "Con García Bross: guion registrado, presupuesto, plan de financiamiento con Ferrecabsa como contribuyente ISR, calendario, currículums y el PRIMER CORTE (la ventana de post exige llegar con corte). Ventana de postproducción: julio 2027.", "owner": "P"}, {"id": "rb-europa", "title": "Explorar la pata europea de RB", "detail": "Con Víctor (nacionalidad ES, residencia FR): mapear qué abre Ibermedia y CNC cinémas du monde para RB, y qué productora ES/FR podría entrar como copro minoritaria de esa película.", "owner": "D"}, {"id": "rb-planb", "title": "Escribir el plan B de RB", "detail": "Una página: qué hacemos si EFICINE no sale en la ventana de julio (resometer en la siguiente, Focine-producción, ajustar calendario). Decidirlo en frío, antes de necesitarlo.", "owner": "P"}]}, {"id": "g3", "title": "Encargos — primeras ventas (meses 1–6)", "items": [{"id": "com-lista", "title": "Lista de 30 contactos calientes", "detail": "Cada socio aporta: productoras (MX y extranjeras) que puedan necesitar service o pata mexicana, comisiones fílmicas, marcas, agencias, músicos con sello. El perfil C la trabaja como pipeline con estatus (contactado / cotizado / cerrado).", "owner": "C"}, {"id": "com-reel", "title": "Reel comercial v1 con material existente", "detail": "Aunque sea con trabajo previo de los socios: 60–90 segundos que digan 'ojo de cine'. Se renueva con cada proyecto entregado.", "owner": "O"}, {"id": "com-machotes", "title": "Plantillas: cotización, contrato, orden de compra", "detail": "Plantillas listas para responder una cotización en 24 horas. Regla de la casa: 50% anticipo / 50% contra entrega, sin anticipo no hay rodaje. Incluir plantilla de cotización de service en inglés.", "owner": "C"}, {"id": "com-primero", "title": "Facturar el primer proyecto", "detail": "Meta: noviembre 2026. Candidatos naturales: un institucional de la red cercana, un videoclip, o días de service para una producción ajena. Importa menos el monto que estrenar el flujo completo (cotizar → contrato → producir → cobrar).", "owner": "C"}, {"id": "com-meta1", "title": "Cerrar el año 1 con 4–6 encargos", "detail": "Piso de 4 (cubre los fijos del año), meta de 6. Concentrarlos fuera de la ventana de rodaje y post de RB (marzo–julio 2027). Revisar el pipeline cada 2 semanas en la junta de socios.", "owner": "C"}]}, {"id": "g4", "title": "Ritmos de la casa (continuo)", "items": [{"id": "rit-junta", "title": "Junta de socios quincenal", "detail": "Una hora, agenda fija: caja, pipeline de encargos, avances de cine, bloqueos. Las decisiones se anotan; lo que no se anota no se decidió."}, {"id": "rit-fondo", "title": "Transferir 20% del margen al fondo de desarrollo (trimestral)", "detail": "Al cierre de cada trimestre, sin excepciones ni aplazamientos. Es la regla que impide que los encargos absorban toda la capacidad de la casa.", "owner": "P"}, {"id": "rit-slate", "title": "Revisión trimestral de slate", "detail": "Qué proyecto avanza, cuál se detiene, qué entra al slot abierto. El calendario del año siguiente se arma primero con los hitos de cine.", "owner": "D"}, {"id": "rit-convocatorias", "title": "Barrido mensual de convocatorias", "detail": "Revisar el calendario de grants (ya existe en TOMO) y decidir a qué se aplica este mes: fondos, labs, mercados, festivales.", "owner": "P"}]}]};</script>
<script>
/* NUEVO NORTE — propuesta de la casa productora.
   Vanilla JS, sin build. El contenido viene de data/ vía las APIs de app.py.
   Español only: no hay toggle de idioma. */
(function () {
  "use strict";

  var VIEWS = ["plan", "timeline", "tareas", "slate", "comercial", "identidad"];

  var S = {
    view: (function () {
      var v = localStorage.getItem("nn_view");
      return VIEWS.indexOf(v) >= 0 ? v : "plan";
    })(),
    md: {},        // plan / identidad markdown, cacheado
    tl: null,      // timeline
    slate: null,
    comercial: null,
    tareas: null
  };

  var T = {
    loading: "Cargando…",
    login_err: "Usuario o contraseña incorrectos",
    plan_sub: "Plan de negocio · 5 años · CDMX",
    ident_sub: "Identidad y pitch · manifiesto, posicionamiento y one-pager",
    tl_sub: "Línea de tiempo · 5 fases anuales, con puerta al final de cada una",
    tl_end: "4–6 largos con crédito de la casa, fondos a nombre propio y encargos que sostienen la operación.",
    tareas_sub: "Checklist de arranque · el avance se guarda para todos los socios",
    slate_sub: "Slate · los proyectos de la casa y su ruta de financiamiento",
    slate_intro: "El <strong>slate</strong> son únicamente los proyectos donde Nuevo Norte es la <strong>casa creativa</strong>: los origina o los desarrolla, decide su ruta y responde por ellos — los dirija un socio o talento externo elegido por la casa. Las <strong>coproducciones minoritarias</strong> en películas ajenas no forman parte del slate (viven en su propio carril, con su propio criterio de entrada), pero sí suman a la filmografía: la meta de 4–6 largos con el crédito de la casa cuenta las dos canastas.",
    com_sub: "Encargos · cine ajeno primero, comercial selectivo después — rangos y reglas de la casa",
    reglas: "Reglas de la casa",
    who: "¿Quién? (D dirección · P producción · C encargos · O post/ops)",
    rol: "Rol de Nuevo Norte",
    ruta: "Ruta",
    fest: "Festivales / mercados meta",
    pasos: "Próximos pasos",
    cliente: "Cliente tipo",
    margen: "Margen",
    hitos: "Hitos"
  };

  var OWNERS = ["", "D", "P", "C", "O"];
  var TRACKS = { cine: "Cine", comercial: "Encargos", empresa: "Empresa" };

  var $ = function (s) { return document.querySelector(s); };

  // ── tiny helpers ──────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function mxn(n) {
    return "$" + Math.round(n).toLocaleString("en-US");
  }
  function api(path, opts) {
    var D = window.NN_DATA, j = {};
    if (path === "/api/auth/me") j = { user: { username: "invitado", display_name: "Invitado" } };
    else if (path === "/api/plan") j = { md: D.plan };
    else if (path === "/api/identidad") j = { md: D.identidad };
    else if (path === "/api/comercial") j = D.comercial;
    else if (path === "/api/timeline") j = { timeline: D.timeline };
    else if (path === "/api/slate") j = { slate: D.slate };
    else if (path === "/api/tareas") j = { groups: D.tareas, state: {} };
    else if (path === "/api/tareas/set") j = { ok: true, state: {} };
    else j = { ok: true };
    j._code = 200;
    return Promise.resolve(j);
  }
  function slug(s) {
    return String(s).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function loading() { return '<div class="loading">' + T.loading + "</div>"; }

  // ── markdown mínimo: encabezados, tablas, listas, citas, bold/em, links ──
  function inline(s) {
    s = esc(s);
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*((?:[^*]|\*(?!\*))+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function renderMd(md) {
    var lines = md.split("\n"), out = [], i = 0;
    function isTableRow(l) { return /^\s*\|.*\|\s*$/.test(l); }
    function isBreak(l) {
      return /^\s*$/.test(l) || /^(#{1,4})\s/.test(l) || isTableRow(l) ||
        /^\s*>/.test(l) || /^---+\s*$/.test(l) || /^\s*([-*]|\d+\.)\s+/.test(l);
    }
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*$/.test(l)) { i++; continue; }
      var h = l.match(/^(#{1,4})\s+(.*)/);
      if (h) {
        var n = h[1].length, txt = h[2];
        var id = n === 2 ? ' id="s-' + slug(txt) + '"' : "";
        out.push("<h" + n + id + ">" + inline(txt) + "</h" + n + ">");
        i++; continue;
      }
      if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
      if (isTableRow(l) && i + 1 < lines.length && /^\s*\|[\s\-|:]+\|\s*$/.test(lines[i + 1])) {
        var cells = function (row) {
          return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
            .map(function (c) { return c.trim(); });
        };
        var html = '<div class="tblwrap"><table><thead><tr>';
        cells(l).forEach(function (c) { html += "<th>" + inline(c) + "</th>"; });
        html += "</tr></thead><tbody>";
        i += 2;
        while (i < lines.length && isTableRow(lines[i])) {
          html += "<tr>";
          cells(lines[i]).forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
          html += "</tr>"; i++;
        }
        out.push(html + "</tbody></table></div>");
        continue;
      }
      if (/^\s*>/.test(l)) {
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, "")); i++;
        }
        out.push("<blockquote>" + renderMd(quote.join("\n")) + "</blockquote>");
        continue;
      }
      var mList = l.match(/^\s*([-*]|\d+\.)\s+/);
      if (mList) {
        var ordered = /^\s*\d+\./.test(l), tag = ordered ? "ol" : "ul";
        var lis = [];
        while (i < lines.length && (mList = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
          var li = mList[2];
          i++;
          // continuación indentada del mismo bullet (párrafo envuelto)
          while (i < lines.length && !isBreak(lines[i])) { li += " " + lines[i].trim(); i++; }
          lis.push("<li>" + inline(li) + "</li>");
        }
        out.push("<" + tag + ">" + lis.join("") + "</" + tag + ">");
        continue;
      }
      var para = [];
      while (i < lines.length && !isBreak(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  // sub-nav de secciones: a partir de una lista de títulos…
  function secNavFrom(titles) {
    if (titles.length < 2) return "";
    return '<nav class="secnav">' + titles.map(function (t) {
      return '<button class="secnav-a" data-goto="s-' + slug(t) + '">' + esc(t) + "</button>";
    }).join("") + "</nav>";
  }
  // …o de los encabezados `## ` de un markdown
  function secNav(md) {
    var heads = [];
    md.split("\n").forEach(function (l) {
      var m = l.match(/^##\s+(.*)/);
      if (m) heads.push(m[1].replace(/\*/g, "").trim());
    });
    return secNavFrom(heads);
  }
  // hover tricolor (idéntico a TOMO): en cada entrada del mouse un color al
  // azar de la misma paleta, nunca el mismo dos veces seguidas
  var TRI = ["var(--accent)", "var(--yellow)", "var(--ai)", "var(--pink)"];
  function randHover(el) {
    var last = -1;
    el.addEventListener("mouseenter", function () {
      var pool = [0, 1, 2, 3].filter(function (i) { return i !== last; });
      last = pool[Math.floor(Math.random() * pool.length)];
      el.style.setProperty("--hovc", TRI[last]);
    });
  }

  function wireSecNav() {
    document.querySelectorAll("#view .secnav-a").forEach(function (b) {
      randHover(b);
      b.addEventListener("click", function () {
        var el = document.getElementById(b.dataset.goto);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  // ── auth ──────────────────────────────────────────────────────────────────
  function showGate() {
    document.body.classList.add("gate");
    $("#gate").hidden = false; $("#topbar").hidden = true; $("#view").hidden = true;
  }
  // menú de secciones fijo bajo el topbar mientras se scrollea el documento.
  // (implementado a mano con scroll en lugar de position:sticky, que no
  // funcionaba de forma confiable; un spacer evita el brinco del layout)
  function secnavScroll() {
    var nav = document.querySelector("#view .secnav");
    if (!nav) return;
    var sp = document.querySelector("#view .secnav-spacer");
    if (!sp) {
      sp = document.createElement("div");
      sp.className = "secnav-spacer";
      nav.parentNode.insertBefore(sp, nav);
    }
    var tb = $("#topbar");
    var tbH = tb && !tb.hidden ? tb.offsetHeight : 0;
    // en pantallas anchas el menú es una columna fija a la izquierda (CSS);
    // el mecanismo de "pegado" horizontal no aplica
    if (window.matchMedia("(min-width:1240px)").matches) {
      nav.classList.remove("stuck");
      nav.style.left = nav.style.width = nav.style.top = "";
      sp.style.height = "0px";
      document.documentElement.style.setProperty("--anchor-off", tbH + 24 + "px");
      return;
    }
    var stuck = nav.classList.contains("stuck");
    var anchor = sp.getBoundingClientRect().top;
    document.documentElement.style.setProperty("--anchor-off", tbH + nav.offsetHeight + 10 + "px");
    if (!stuck && anchor <= tbH + 2) {
      var r = nav.closest(".doc").getBoundingClientRect();
      sp.style.height = nav.offsetHeight + "px";
      nav.style.left = r.left + "px";
      nav.style.width = r.width + "px";
      nav.style.top = tbH + "px";
      nav.classList.add("stuck");
    } else if (stuck && anchor > tbH + 2) {
      nav.classList.remove("stuck");
      nav.style.left = nav.style.width = nav.style.top = "";
      sp.style.height = "0px";
    }
  }
  window.addEventListener("scroll", secnavScroll, { passive: true });
  window.addEventListener("resize", function () {
    var nav = document.querySelector("#view .secnav.stuck");
    if (nav) {
      nav.classList.remove("stuck");
      nav.style.left = nav.style.width = nav.style.top = "";
      var sp = document.querySelector("#view .secnav-spacer");
      if (sp) sp.style.height = "0px";
    }
    secnavScroll();
  });

  function showApp() {
    document.body.classList.remove("gate");
    $("#gate").hidden = true; $("#topbar").hidden = false; $("#view").hidden = false;
    render();
    secnavScroll();
  }
  function doLogin() {
    var u = $("#login-user").value, p = $("#login-pass").value;
    api("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (j) {
      if (j.user) showApp(); else $("#login-err").textContent = T.login_err;
    });
  }

  // ── router ────────────────────────────────────────────────────────────────
  function syncHeader() {
    document.querySelectorAll("#sections .psec").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === S.view);
    });
  }
  function go(view) {
    S.view = view;
    try { localStorage.setItem("nn_view", view); } catch (e) {}
    render();
  }
  function render() {
    syncHeader();
    if (S.view === "plan" || S.view === "identidad") renderDoc(S.view);
    else if (S.view === "timeline") renderTimeline();
    else if (S.view === "tareas") renderTareas();
    else if (S.view === "slate") renderSlate();
    else renderComercial();
  }

  // ── Plan / Identidad ──────────────────────────────────────────────────────
  function renderDoc(view) {
    var v = $("#view");
    if (!S.md[view]) {
      v.innerHTML = loading();
      api("/api/" + view).then(function (j) {
        S.md[view] = j.md || "*(falta el documento)*";
        if (S.view === view) renderDoc(view);
      });
      return;
    }
    var md = S.md[view];
    v.innerHTML = '<div class="doc"><p class="doc-sub">' +
      (view === "plan" ? T.plan_sub : T.ident_sub) + "</p>" +
      secNav(md) + renderMd(md) + "</div>";
    wireSecNav();
    window.scrollTo(0, 0);
  }

  // ── Timeline ──────────────────────────────────────────────────────────────
  function renderTimeline() {
    var v = $("#view");
    if (!S.tl) {
      v.innerHTML = loading();
      api("/api/timeline").then(function (j) {
        S.tl = j.timeline || []; if (S.view === "timeline") renderTimeline();
      });
      return;
    }
    var html = '<div class="doc"><p class="doc-sub">' + T.tl_sub + "</p></div><div class=\"tl\">";
    S.tl.forEach(function (n) {
      html += '<section class="tl-node">' +
        '<div class="tl-when"><span class="ph">' + esc(n.fase) + "</span>" + esc(n.when) + "</div>" +
        "<h3>" + esc(n.title) + "</h3>" +
        "<p>" + esc(n.body) + "</p>";
      if (n.hitos && n.hitos.length) {
        html += '<ul class="hitos">';
        n.hitos.forEach(function (h) {
          var tr = h.track || "empresa";
          html += '<li><span class="track t-' + esc(tr) + '">' + esc(TRACKS[tr] || tr) + "</span>" +
            '<span class="hito-when">' + esc(h.when) + "</span>" +
            '<span class="hito-title">' + esc(h.title) + "</span></li>";
        });
        html += "</ul>";
      }
      if (n.gate) html += '<div class="tl-gate">⚑ ' + esc(n.gate) + "</div>";
      html += "</section>";
    });
    html += '<div class="tl-end">' + T.tl_end + "</div></div>";
    v.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // ── Tareas (checklist de arranque, estado compartido) ─────────────────────
  function ownerOf(it, st) {
    return (st && typeof st.owner === "string") ? st.owner : (it.owner || "");
  }
  function renderTareas() {
    var v = $("#view");
    if (!S.tareas) {
      v.innerHTML = loading();
      api("/api/tareas").then(function (j) {
        S.tareas = j; if (S.view === "tareas") renderTareas();
      });
      return;
    }
    var groups = S.tareas.groups || [], state = S.tareas.state || {};
    var total = 0, done = 0;
    groups.forEach(function (g) {
      (g.items || []).forEach(function (it) { total++; if ((state[it.id] || {}).done) done++; });
    });
    var html = '<div class="doc tareas"><p class="doc-sub">' + T.tareas_sub + "</p>" +
      secNavFrom(groups.map(function (g) { return g.title; })) +
      '<div class="tk-prog"><div class="tk-bar"><span style="width:' +
      (total ? Math.round(done / total * 100) : 0) + '%"></span></div>' +
      '<span class="tk-count">' + done + " / " + total + "</span></div>";
    groups.forEach(function (g) {
      var items = g.items || [];
      var gdone = items.filter(function (it) { return (state[it.id] || {}).done; }).length;
      html += '<div class="tk-grouphead" id="s-' + slug(g.title) + '"><h2>' + esc(g.title) + "</h2>" +
        '<span class="tk-gcount">' + gdone + " / " + items.length + "</span></div>";
      items.forEach(function (it) {
        var st = state[it.id] || {}, owner = ownerOf(it, st);
        var crit = /^★/.test(it.title);
        html += '<div class="tk-item' + (st.done ? " done" : "") + (crit ? " crit" : "") +
          '" data-id="' + esc(it.id) + '">' +
          '<button class="tk-check" aria-label="marcar">' + (st.done ? "✓" : "") + "</button>" +
          '<div class="tk-body"><div class="tk-title">' + esc(it.title) + "</div>" +
          '<div class="tk-detail">' + esc(it.detail) + "</div></div>" +
          '<button class="tk-own' + (owner ? " on" : "") + '" title="' + esc(T.who) + '">' +
          (owner || "·") + "</button></div>";
      });
    });
    v.innerHTML = html + "</div>";
    wireSecNav();
    document.querySelectorAll("#view .tk-item").forEach(function (el) {
      var id = el.dataset.id;
      el.querySelector(".tk-check").addEventListener("click", function () {
        set(id, { done: !(S.tareas.state[id] || {}).done });
      });
      el.querySelector(".tk-own").addEventListener("click", function () {
        var it = null;
        (S.tareas.groups || []).forEach(function (g) {
          (g.items || []).forEach(function (x) { if (x.id === id) it = x; });
        });
        var cur = ownerOf(it || {}, S.tareas.state[id]);
        var next = OWNERS[(OWNERS.indexOf(cur) + 1) % OWNERS.length];
        set(id, { owner: next });
      });
    });
    window.scrollTo(0, 0);
  }
  function set(id, patch) {
    patch.id = id;
    api("/api/tareas/set", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch)
    }).then(function (j) {
      if (j.state) {
        S.tareas.state = j.state;
        if (S.view === "tareas") {
          var y = window.scrollY;
          renderTareas();
          window.scrollTo(0, y);
        }
      }
    });
  }

  // ── Slate ─────────────────────────────────────────────────────────────────
  function renderSlate() {
    var v = $("#view");
    if (!S.slate) {
      v.innerHTML = loading();
      api("/api/slate").then(function (j) {
        S.slate = j.slate || []; if (S.view === "slate") renderSlate();
      });
      return;
    }
    var html = '<div class="doc slate"><p class="doc-sub">' + T.slate_sub + "</p>" +
      '<p class="slate-intro">' + T.slate_intro + "</p>";
    S.slate.forEach(function (p) {
      html += '<article class="proj">' +
        '<header class="proj-head"><div><h2>' + esc(p.titulo) + "</h2>" +
        '<div class="proj-tipo">' + esc(p.tipo) + "</div></div>" +
        '<span class="estado e-' + esc(p.estado_color || "abierto") + '">' + esc(p.estado) + "</span></header>" +
        '<p class="proj-log">' + esc(p.logline) + "</p>" +
        '<div class="proj-sec"><h4>' + T.rol + "</h4><p>" + esc(p.rol_nn) + "</p></div>";
      if (p.ruta && p.ruta.length) {
        html += '<div class="proj-sec"><h4>' + T.ruta + "</h4><ol class=\"ruta\">" +
          p.ruta.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ol></div>";
      }
      if (p.festivales_meta && p.festivales_meta.length) {
        html += '<div class="proj-sec"><h4>' + T.fest + '</h4><div class="chips">' +
          p.festivales_meta.map(function (f) { return '<span class="chip">' + esc(f) + "</span>"; }).join("") +
          "</div></div>";
      }
      if (p.proximos_pasos) {
        html += '<div class="proj-next"><span class="lbl">' + T.pasos + "</span>" +
          esc(p.proximos_pasos) + "</div>";
      }
      html += "</article>";
    });
    v.innerHTML = html + "</div>";
    window.scrollTo(0, 0);
  }

  // ── Comercial ─────────────────────────────────────────────────────────────
  function renderComercial() {
    var v = $("#view");
    if (!S.comercial) {
      v.innerHTML = loading();
      api("/api/comercial").then(function (j) {
        S.comercial = j; if (S.view === "comercial") renderComercial();
      });
      return;
    }
    var c = S.comercial;
    var html = '<div class="doc comercial"><p class="doc-sub">' + T.com_sub + "</p>" +
      secNavFrom((c.lineas || []).map(function (l) { return l.nombre; }).concat(c.reglas && c.reglas.length ? [T.reglas] : [])) +
      '<p class="nota">' + esc(c.nota) + "</p>";
    (c.lineas || []).forEach(function (l) {
      var r = l.rango_mxn || [];
      html += '<article class="linea" id="s-' + slug(l.nombre) + '"><header class="linea-head">' +
        "<h2>" + esc(l.nombre) + "</h2>" +
        '<div class="precio"><span class="rango">MXN ' + mxn(r[0]) + " – " + mxn(r[1]) + "</span>" +
        '<span class="unidad">' + esc(l.unidad) + "</span></div></header>" +
        "<p>" + esc(l.desc) + "</p>" +
        '<dl class="meta">' +
        "<dt>" + T.cliente + "</dt><dd>" + esc(l.cliente_tipo) + "</dd>" +
        "<dt>" + T.margen + "</dt><dd>" + esc(l.margen) + "</dd></dl>" +
        '<p class="notas">' + esc(l.notas) + "</p></article>";
    });
    if (c.reglas && c.reglas.length) {
      html += '<div class="reglas" id="s-' + slug(T.reglas) + '"><h2>' + T.reglas + "</h2><ol>" +
        c.reglas.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ol></div>";
    }
    v.innerHTML = html + "</div>";
    wireSecNav();
    window.scrollTo(0, 0);
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  $("#login-btn").addEventListener("click", doLogin);
  $("#login-pass").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  $("#login-user").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#login-pass").focus(); });

  document.querySelectorAll("#sections .psec").forEach(function (b) {
    randHover(b);
    b.addEventListener("click", function () { go(b.dataset.view); });
  });
  randHover($("#wordmark"));

  // hover tricolor también en los títulos y subtítulos del contenido: los
  // encabezados se regeneran en cada render, así que se delega en #view
  $("#view").addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest("h1,h2,h3,h4");
    if (!el || !$("#view").contains(el)) return;
    if (el.contains(e.relatedTarget)) return;   // el mouse ya estaba dentro
    var last = +el.dataset.tri;
    var pool = [0, 1, 2, 3].filter(function (i) { return i !== last; });
    var i = pool[Math.floor(Math.random() * pool.length)];
    el.dataset.tri = i;
    el.style.setProperty("--hovc", TRI[i]);
  });
  $("#themebtn").addEventListener("click", function () {
    var light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("tomo_theme", "dark");
    } else {
      document.documentElement.setAttribute("data-theme", "light");
      localStorage.setItem("tomo_theme", "light");
    }
  });
  $("#logoutbtn").addEventListener("click", function () {
    api("/api/auth/logout", { method: "POST" }).then(showGate);
  });
  $("#wordmark").addEventListener("click", function () {
    if (!document.body.classList.contains("gate")) go("plan");
  });

  api("/api/auth/me").then(function (j) {
    if (j.user) showApp(); else showGate();
  }).catch(showGate);
})();

</script>

</body>
</html>
