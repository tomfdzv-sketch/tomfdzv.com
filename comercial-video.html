<script>
document.querySelectorAll('.feature.live').forEach(cell=>{
  const files=(cell.dataset.imgs||'').split(',').filter(Boolean);
  const base=cell.dataset.base, gs=cell.querySelectorAll('img.gs');
  if(files.length<2||gs.length<2)return;
  let n=Math.floor(Math.random()*files.length),cur=gs[0],nxt=gs[1];
  cur.src=base+'/'+files[n%files.length];n++;cur.classList.add('on');
  function show(){const img=nxt;img.src=base+'/'+files[n%files.length];n++;
    img.onload=()=>{img.classList.add('on');cur.classList.remove('on');
      const t=cur;cur=img;nxt=t;};}
  setTimeout(()=>{show();setInterval(show,5000);},1200+Math.random()*4800);
});
</script>
<script>
const _m=document.getElementById('mode');
if(_m)_m.onclick=e=>{e.preventDefault();
  const d=document.documentElement.classList.toggle('dark');
  localStorage.theme=d?'dark':'light'};
const _b=document.getElementById('burger');
if(_b)_b.onclick=e=>{e.preventDefault();
  _b.closest('header').classList.toggle('open')};
</script>
<script>
(()=>{
const ims=[...document.querySelectorAll('.gallery figure img')];
if(!ims.length)return;
const lb=document.createElement('div');lb.className='lb';
lb.innerHTML='<button class="lbx" aria-label="Cerrar">&times;</button>'
 +'<button class="lbp" aria-label="Anterior">&larr;</button><img alt="">'
 +'<button class="lbn" aria-label="Siguiente">&rarr;</button>'
 +'<div class="lbc mono"></div>';
document.body.appendChild(lb);
const im=lb.querySelector('img'),ct=lb.querySelector('.lbc');let k=-1;
const pad=n=>String(n).padStart(2,'0');
const show=i=>{k=(i+ims.length)%ims.length;
 im.src=ims[k].src;im.alt=ims[k].alt;
 ct.textContent=pad(k+1)+' / '+pad(ims.length);
 new Image().src=ims[(k+1)%ims.length].src};
const open=i=>{show(i);lb.classList.add('on');
 document.body.style.overflow='hidden'};
const close=()=>{lb.classList.remove('on');
 document.body.style.overflow=''};
ims.forEach((el,i)=>el.addEventListener('click',()=>open(i)));
lb.querySelector('.lbx').onclick=close;
lb.querySelector('.lbp').onclick=e=>{e.stopPropagation();show(k-1)};
lb.querySelector('.lbn').onclick=e=>{e.stopPropagation();show(k+1)};
im.onclick=e=>{e.stopPropagation();show(k+1)};
lb.onclick=e=>{if(e.target===lb)close()};
addEventListener('keydown',e=>{
 if(!lb.classList.contains('on'))return;
 if(e.key==='Escape')close();
 else if(e.key==='ArrowLeft')show(k-1);
 else if(e.key==='ArrowRight')show(k+1)});
let tx=0;
lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{
 const d=e.changedTouches[0].clientX-tx;
 if(Math.abs(d)>40)show(k+(d<0?1:-1))},{passive:true});
})();
</script>
