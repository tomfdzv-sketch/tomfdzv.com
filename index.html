  function on(){document.documentElement.classList.add('reel-on');

  function next(){wrap.classList.remove('imgon');play();}
  function play(){
    var it=IT[n%IT.length];n++;
    if(tm){clearTimeout(tm);tm=null;}
    if(it.v){
      wrap.classList.remove('imgon');
      v.src=it.s;v.load();if(cap)cap.textContent='▸ '+it.c;
      var p=v.play();if(p&&p.catch)p.catch(function(){next();});
    }else{
      im.onload=function(){
        wrap.classList.remove('play');v.pause();
        void im.offsetWidth;
        wrap.classList.add('imgon');on();
        if(cap)cap.textContent='▸ '+it.c;
        tm=setTimeout(next,6000);
      };
      im.onerror=function(){next();};
      im.src=it.s;
    }
  }
  v.addEventListener('playing',function(){wrap.classList.add('play');on();});
  v.addEventListener('ended',next);
  v.addEventListener('error',next);
  play();
})();
