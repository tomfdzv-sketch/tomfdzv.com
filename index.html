<div id="reel" aria-hidden="true"><video muted playsinline preload="auto" disablepictureinpicture></video><div class="veil"></div></div><div id="reelcap" class="mono"></div>
<script>
(function(){
  var CLIPS=["reel1.mp4", "reel10_nb.mp4", "reel11_nb.mp4", "reel12_nbdc.mp4", "reel2.mp4", "reel3.mp4", "reel4.mp4", "reel5.mp4", "reel6.mp4", "reel7_sentir.mp4", "reel8_sentir.mp4", "reel9_sentir.mp4", "reel_2y3a.mp4", "reel_2y3b.mp4"];
  if(!CLIPS.length)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(!matchMedia('(min-width:640px)').matches)return;   // móvil: sin video
  var wrap=document.getElementById('reel'),cap=document.getElementById('reelcap');
  var v=wrap.querySelector('video'),q=CLIPS.slice(),n=0,moving=false;
  for(var i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=q[i];q[i]=q[j];q[j]=t;}
  function title(f){
    return f.indexOf('sentir')>-1?'El Sentir de las Montañas'
         : f.indexOf('_nb')>-1?'New Balance — Toluca Away Kit'
         : f.indexOf('2y3')>-1?'Dos Noches y Tres Días'
         : f.indexOf('lmff')>-1?'London Migration Film Festival '+(f.match(/lmff(\d{4})/)||['',''])[1]
         : 'Bajo el Mismo Sol';
  }
  function play(){
    var f=q[n%q.length];n++;
    v.src='assets/reel/'+f;v.load();
    if(cap)cap.textContent='▸ '+title(f);
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  }
  function next(){                       // fundido a negro y siguiente clip
    if(moving)return;moving=true;
    wrap.classList.remove('play');
    setTimeout(function(){moving=false;play();},600);
  }
  v.addEventListener('playing',function(){
    moving=false;wrap.classList.add('play');
    document.documentElement.classList.add('reel-on');
    document.body.classList.add('reel-on');
  });
  v.addEventListener('ended',next);
  v.addEventListener('error',next);
  play();
})();
</script>
<div class="gatespace" aria-hidden="true"></div>
<script>
document.getElementById('mode').onclick=e=>{e.preventDefault();
  const d=document.documentElement.classList.toggle('dark');
  localStorage.theme=d?'dark':'light'};
</script>
